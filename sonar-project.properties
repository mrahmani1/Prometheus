# SonarQube Configuration for Prometheus AI Platform

# Project Information
sonar.projectKey=prometheus-ai-platform
sonar.projectName=Prometheus AI Platform
sonar.projectVersion=1.0.0
sonar.organization=prometheus-ai

# Source Code Configuration
sonar.sources=services/,helm/,scripts/,terraform/
sonar.tests=services/*/tests/,tests/

# Language-specific Configuration
sonar.python.coverage.reportPaths=services/*/coverage.xml
sonar.javascript.lcov.reportPaths=services/api-gateway/coverage/lcov.info

# Exclusions
sonar.exclusions=**/*_test.py,**/*.test.js,**/node_modules/**,**/__pycache__/**,**/venv/**,**/.terraform/**,**/build/**,**/dist/**

# Test Exclusions
sonar.test.exclusions=**/tests/**,**/*_test.py,**/*.test.js

# Coverage Exclusions
sonar.coverage.exclusions=**/tests/**,**/*_test.py,**/*.test.js,**/examples/**,**/docs/**

# Duplication Exclusions
sonar.cpd.exclusions=**/tests/**,**/examples/**

# Quality Gate Configuration
sonar.qualitygate.wait=true

# Code Analysis Configuration
sonar.python.pylint.reportPaths=pylint-report.txt
sonar.python.bandit.reportPaths=bandit-report.json
sonar.python.flake8.reportPaths=flake8-report.txt

# Security Configuration
sonar.security.hotspots.inheritFromParent=true

# Technical Debt Configuration
sonar.technicalDebt.hoursInDay=8
sonar.technicalDebt.developmentCost=30

# Branch Configuration
sonar.branch.name=${CI_COMMIT_REF_NAME}
sonar.branch.target=main

# Pull Request Configuration (for GitHub/GitLab)
sonar.pullrequest.key=${CI_MERGE_REQUEST_IID}
sonar.pullrequest.branch=${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}
sonar.pullrequest.base=${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}

# Additional Properties
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
sonar.scm.forceReloadAll=true

# Language-specific Rules
sonar.python.xunit.reportPath=services/*/report.xml
sonar.javascript.environments=node,browser

# Docker and Infrastructure as Code
sonar.docker.file.patterns=**/Dockerfile*
sonar.terraform.file.patterns=**/*.tf

# Custom Rules and Profiles
sonar.profile.python=Sonar way
sonar.profile.js=Sonar way

# Logging
sonar.log.level=INFO
sonar.verbose=false