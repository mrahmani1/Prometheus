name: Quality Gates

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  quality-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
    
    - name: Code quality check
      run: |
        echo "Running code quality checks..."
        
        echo "Checking Black formatting..."
        if ! black --check services; then
          echo "::warning::Black formatting issues found"
        fi
        
        echo "Checking import sorting..."
        if ! isort --check-only services; then
          echo "::warning::Import sorting issues found"
        fi
        
        echo "Running flake8 linting..."
        flake8 services --count --statistics --show-source
        
        echo "Running pylint analysis..."
        if ! pylint services --fail-under=8.0; then
          echo "::warning::Pylint score below threshold"
        fi
    
    - name: Security check
      run: |
        bandit -r services -ll
    
    - name: Test coverage check
      run: |
        pytest --cov=services --cov-fail-under=80
    
    - name: Comment PR
      uses: actions/github-script@v7
      if: failure()
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: 'Quality gates failed. Please fix the issues before merging.'
          })