name: Comprehensive Testing Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run benchmark tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt
        pip install -r services/helios-core/requirements.txt
    
    - name: Run unit tests
      run: |
        python tests/run_tests.py unit --verbose
    
    - name: Upload unit test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results-${{ matrix.python-version }}
        path: tests/test-results/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_PASSWORD: prometheus123
          POSTGRES_USER: prometheus
          POSTGRES_DB: prometheus_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      influxdb:
        image: influxdb:2.7
        env:
          INFLUXDB_DB: prometheus_test
          INFLUXDB_ADMIN_USER: admin
          INFLUXDB_ADMIN_PASSWORD: prometheus123
        ports:
          - 8086:8086
      
      neo4j:
        image: neo4j:5.12
        env:
          NEO4J_AUTH: neo4j/prometheus123
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7474:7474
          - 7687:7687
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt
        pip install -r services/helios-core/requirements.txt
        pip install -r services/data-ingestion/requirements.txt
    
    - name: Install Node.js dependencies
      run: |
        cd services/api-gateway
        npm ci
    
    - name: Wait for services to be ready
      run: |
        # Wait for PostgreSQL
        until pg_isready -h localhost -p 5432 -U prometheus; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        
        # Wait for Redis
        until redis-cli -h localhost -p 6379 ping; do
          echo "Waiting for Redis..."
          sleep 2
        done
        
        # Wait for InfluxDB
        until curl -f http://localhost:8086/health; do
          echo "Waiting for InfluxDB..."
          sleep 2
        done
        
        # Wait for Neo4j
        until curl -f http://localhost:7474; do
          echo "Waiting for Neo4j..."
          sleep 2
        done
    
    - name: Set up test databases
      run: |
        # PostgreSQL setup
        PGPASSWORD=prometheus123 psql -h localhost -U prometheus -d prometheus_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"
        
        # InfluxDB setup
        curl -XPOST "http://localhost:8086/query" --data-urlencode "q=CREATE DATABASE prometheus_test"
    
    - name: Run integration tests
      env:
        DATABASE_URL: postgresql://prometheus:prometheus123@localhost:5432/prometheus_test
        REDIS_URL: redis://localhost:6379/0
        INFLUXDB_URL: http://localhost:8086
        NEO4J_URL: bolt://localhost:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: prometheus123
      run: |
        python tests/run_tests.py integration --verbose
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: tests/test-results/

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt
        pip install -r services/helios-core/requirements.txt
    
    - name: Run performance tests
      run: |
        python tests/run_tests.py performance --verbose
    
    - name: Upload performance test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-test-results
        path: tests/test-results/

  benchmark-tests:
    name: Benchmark Validation Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[benchmark]')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt
        pip install -r services/helios-core/requirements.txt
    
    - name: Download benchmark datasets
      run: |
        # Download or generate benchmark datasets
        mkdir -p tests/benchmark_data
        # Add commands to download real geological datasets if available
    
    - name: Run benchmark tests
      run: |
        python tests/run_tests.py benchmark --verbose --report
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-test-results
        path: |
          tests/test-results/
          tests/test_report.txt

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt
        pip install -r services/helios-core/requirements.txt
    
    - name: Generate coverage report
      run: |
        python tests/run_tests.py coverage --verbose
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: tests/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: tests/coverage_html/

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install security testing tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run Bandit security linter
      run: |
        bandit -r services/ -f json -o bandit-report.json
      continue-on-error: true
    
    - name: Run Safety check
      run: |
        safety check --json --output safety-report.json
      continue-on-error: true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install code quality tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
    
    - name: Run Black formatter check
      run: |
        black --check --diff services/ tests/
    
    - name: Run isort import sorting check
      run: |
        isort --check-only --diff services/ tests/
    
    - name: Run Flake8 linter
      run: |
        flake8 services/ tests/ --max-line-length=100 --extend-ignore=E203,W503
    
    - name: Run MyPy type checker
      run: |
        mypy services/ --ignore-missing-imports
      continue-on-error: true

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, performance-tests, coverage-report, security-tests, code-quality]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Generate test summary
      run: |
        echo "# Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        
        # Check unit test results
        if [ -d "unit-test-results-3.11" ]; then
          echo "✅ Unit Tests: Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Unit Tests: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check integration test results
        if [ -d "integration-test-results" ]; then
          echo "✅ Integration Tests: Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Integration Tests: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check performance test results
        if [ -d "performance-test-results" ]; then
          echo "✅ Performance Tests: Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Performance Tests: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
        if [ -d "coverage-report" ]; then
          echo "📊 Coverage report generated successfully" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Security Analysis" >> $GITHUB_STEP_SUMMARY
        if [ -d "security-reports" ]; then
          echo "🔒 Security analysis completed" >> $GITHUB_STEP_SUMMARY
        fi