name: Prometheus AI Platform CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: prometheus-ai

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, helios-core, data-ingestion, simulation, realtime-processor, volcano-watchtower]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js (for api-gateway)
      if: matrix.service == 'api-gateway'
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: services/${{ matrix.service }}/package-lock.json

    - name: Set up Python (for Python services)
      if: matrix.service != 'api-gateway'
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: services/${{ matrix.service }}/requirements.txt

    - name: Install dependencies (Node.js)
      if: matrix.service == 'api-gateway'
      working-directory: services/${{ matrix.service }}
      run: npm ci

    - name: Install dependencies (Python)
      if: matrix.service != 'api-gateway'
      working-directory: services/${{ matrix.service }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run linting (Node.js)
      if: matrix.service == 'api-gateway'
      working-directory: services/${{ matrix.service }}
      run: npm run lint || true

    - name: Run linting (Python)
      if: matrix.service != 'api-gateway'
      working-directory: services/${{ matrix.service }}
      run: |
        pip install flake8 black isort
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check .
        isort --check-only .

    - name: Run tests (Node.js)
      if: matrix.service == 'api-gateway'
      working-directory: services/${{ matrix.service }}
      run: npm test

    - name: Run tests (Python)
      if: matrix.service != 'api-gateway'
      working-directory: services/${{ matrix.service }}
      run: pytest tests/ -v --cov=. --cov-report=xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: services/${{ matrix.service }}/coverage.xml
        flags: ${{ matrix.service }}
        name: ${{ matrix.service }}-coverage

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  build-and-push:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [api-gateway, helios-core, data-ingestion, simulation, realtime-processor, volcano-watchtower]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: services/${{ matrix.service }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig

    - name: Deploy to staging
      run: |
        export KUBECONFIG=kubeconfig
        kubectl apply -f kubernetes/namespace.yaml
        kubectl apply -f kubernetes/configmap.yaml
        kubectl apply -f kubernetes/secrets.yaml
        kubectl apply -f kubernetes/persistent-volumes.yaml
        kubectl apply -f kubernetes/database-deployments.yaml
        kubectl apply -f kubernetes/api-gateway-deployment.yaml
        
        # Wait for deployment to be ready
        kubectl wait --for=condition=available --timeout=300s deployment/api-gateway -n prometheus-ai

    - name: Run integration tests
      run: |
        export KUBECONFIG=kubeconfig
        # Get the external IP of the API gateway
        GATEWAY_IP=$(kubectl get service api-gateway-service -n prometheus-ai -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        
        # Run integration tests against staging environment
        npm install -g newman
        newman run tests/integration/prometheus-api.postman_collection.json \
          --env-var "base_url=http://$GATEWAY_IP" \
          --reporters cli,junit \
          --reporter-junit-export integration-test-results.xml

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig

    - name: Deploy to production
      run: |
        export KUBECONFIG=kubeconfig
        
        # Apply configurations
        kubectl apply -f kubernetes/namespace.yaml
        kubectl apply -f kubernetes/configmap.yaml
        kubectl apply -f kubernetes/secrets.yaml
        kubectl apply -f kubernetes/persistent-volumes.yaml
        
        # Rolling update deployment
        kubectl apply -f kubernetes/database-deployments.yaml
        kubectl apply -f kubernetes/api-gateway-deployment.yaml
        
        # Wait for all deployments to be ready
        kubectl wait --for=condition=available --timeout=600s deployment --all -n prometheus-ai

    - name: Verify deployment
      run: |
        export KUBECONFIG=kubeconfig
        kubectl get pods -n prometheus-ai
        kubectl get services -n prometheus-ai
        
        # Health check
        GATEWAY_IP=$(kubectl get service api-gateway-service -n prometheus-ai -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        curl -f http://$GATEWAY_IP/health || exit 1

    - name: Notify deployment success
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: 'Prometheus AI Platform deployed successfully to production!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  cleanup:
    runs-on: ubuntu-latest
    if: always()
    needs: [test, security-scan, build-and-push, deploy-staging, deploy-production]
    
    steps:
    - name: Clean up old images
      run: |
        # Clean up old container images to save storage
        echo "Cleaning up old container images..."
        # This would typically involve calling container registry APIs
        # to remove old images based on retention policies