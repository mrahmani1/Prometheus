apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "prometheus-database-stack.labels" . | nindent 4 }}
    component: secrets
type: Opaque
data:
  # PostgreSQL secrets
  postgres-db: {{ .Values.postgresql.auth.database | b64enc | quote }}
  postgres-user: {{ .Values.postgresql.auth.username | b64enc | quote }}
  postgres-password: {{ .Values.postgresql.auth.password | default (randAlphaNum 32) | b64enc | quote }}
  postgres-replication-password: {{ randAlphaNum 32 | b64enc | quote }}
  postgres-exporter-dsn: {{ printf "postgresql://%s:%s@postgres:5432/%s?sslmode=disable" .Values.postgresql.auth.username (.Values.postgresql.auth.password | default (randAlphaNum 32)) .Values.postgresql.auth.database | b64enc | quote }}
  
  # InfluxDB secrets
  influxdb-admin-user: {{ .Values.influxdb.auth.admin.username | b64enc | quote }}
  influxdb-admin-password: {{ .Values.influxdb.auth.admin.password | default (randAlphaNum 32) | b64enc | quote }}
  influxdb-admin-token: {{ .Values.influxdb.auth.admin.token | default (randAlphaNum 64) | b64enc | quote }}
  
  # Neo4j secrets
  neo4j-password: {{ .Values.neo4j.auth.password | default (randAlphaNum 32) | b64enc | quote }}
  neo4j-auth: {{ printf "%s/%s" .Values.neo4j.auth.username (.Values.neo4j.auth.password | default (randAlphaNum 32)) | b64enc | quote }}
  
  # Redis secrets
  redis-password: {{ .Values.redis.auth.password | default (randAlphaNum 32) | b64enc | quote }}
  
  # TimescaleDB secrets
  timescaledb-db: {{ .Values.timescaledb.auth.database | b64enc | quote }}
  timescaledb-user: {{ .Values.timescaledb.auth.username | b64enc | quote }}
  timescaledb-password: {{ .Values.timescaledb.auth.password | default (randAlphaNum 32) | b64enc | quote }}
  
  # Backup encryption key
  backup-encryption-key: {{ randAlphaNum 64 | b64enc | quote }}
  
  # Service mesh certificates (if enabled)
  {{- if .Values.serviceMesh.enabled }}
  tls-cert: {{ randAlphaNum 2048 | b64enc | quote }}
  tls-key: {{ randAlphaNum 2048 | b64enc | quote }}
  ca-cert: {{ randAlphaNum 2048 | b64enc | quote }}
  {{- end }}