steps:
  # Code Quality and Security Scanning
  - name: 'sonarqube/sonar-scanner-cli:latest'
    id: 'sonar-analysis'
    env:
      - 'SONAR_TOKEN=${_SONAR_TOKEN}'
      - 'SONAR_HOST_URL=${_SONAR_HOST_URL}'
    args:
      - '-Dsonar.projectKey=${_SONAR_PROJECT_KEY}'
      - '-Dsonar.sources=.'
      - '-Dsonar.qualitygate.wait=true'

  - name: 'aquasec/trivy:latest'
    id: 'trivy-fs-scan'
    args:
      - 'fs'
      - '--format'
      - 'sarif'
      - '--output'
      - 'trivy-results.sarif'
      - '.'

  # Python Services Testing
  - name: 'python:3.11'
    id: 'python-tests-helios-core'
    dir: 'services/helios-core'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install -r requirements.txt
        pip install pytest pytest-cov
        pytest tests/ --cov=. --cov-report=xml --junitxml=report.xml

  - name: 'python:3.11'
    id: 'python-tests-data-ingestion'
    dir: 'services/data-ingestion'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install -r requirements.txt
        pip install pytest pytest-cov
        pytest tests/ --cov=. --cov-report=xml --junitxml=report.xml

  - name: 'python:3.11'
    id: 'python-tests-volcano-watchtower'
    dir: 'services/volcano-watchtower'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install -r requirements.txt
        pip install pytest pytest-cov
        pytest tests/ --cov=. --cov-report=xml --junitxml=report.xml

  # Node.js Service Testing
  - name: 'node:18'
    id: 'nodejs-tests'
    dir: 'services/api-gateway'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm ci
        npm test -- --coverage --watchAll=false --ci

  # Build Docker Images with Multi-stage Security Scanning
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-helios-core'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/helios-core:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/helios-core:latest'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/helios-core:latest'
      - './services/helios-core'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-data-ingestion'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/data-ingestion:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/data-ingestion:latest'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/data-ingestion:latest'
      - './services/data-ingestion'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-volcano-watchtower'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/volcano-watchtower:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/volcano-watchtower:latest'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/volcano-watchtower:latest'
      - './services/volcano-watchtower'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api-gateway'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/api-gateway:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/api-gateway:latest'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/api-gateway:latest'
      - './services/api-gateway'

  # Container Security Scanning
  - name: 'aquasec/trivy:latest'
    id: 'container-scan-helios-core'
    args:
      - 'image'
      - '--format'
      - 'sarif'
      - '--output'
      - 'trivy-helios-core.sarif'
      - 'gcr.io/$PROJECT_ID/helios-core:$COMMIT_SHA'

  - name: 'aquasec/trivy:latest'
    id: 'container-scan-data-ingestion'
    args:
      - 'image'
      - '--format'
      - 'sarif'
      - '--output'
      - 'trivy-data-ingestion.sarif'
      - 'gcr.io/$PROJECT_ID/data-ingestion:$COMMIT_SHA'

  - name: 'aquasec/trivy:latest'
    id: 'container-scan-volcano-watchtower'
    args:
      - 'image'
      - '--format'
      - 'sarif'
      - '--output'
      - 'trivy-volcano-watchtower.sarif'
      - 'gcr.io/$PROJECT_ID/volcano-watchtower:$COMMIT_SHA'

  - name: 'aquasec/trivy:latest'
    id: 'container-scan-api-gateway'
    args:
      - 'image'
      - '--format'
      - 'sarif'
      - '--output'
      - 'trivy-api-gateway.sarif'
      - 'gcr.io/$PROJECT_ID/api-gateway:$COMMIT_SHA'

  # Push Images to Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-images'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/helios-core'
    waitFor: ['build-helios-core', 'container-scan-helios-core']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/data-ingestion'
    waitFor: ['build-data-ingestion', 'container-scan-data-ingestion']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/volcano-watchtower'
    waitFor: ['build-volcano-watchtower', 'container-scan-volcano-watchtower']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/api-gateway'
    waitFor: ['build-api-gateway', 'container-scan-api-gateway']

  # Deploy to Staging (if develop branch)
  - name: 'gcr.io/cloud-builders/gke-deploy'
    id: 'deploy-staging'
    args:
      - 'run'
      - '--filename=kubernetes/'
      - '--cluster=prometheus-staging'
      - '--location=us-central1-a'
      - '--namespace=prometheus-staging'
      - '--image=gcr.io/$PROJECT_ID/helios-core:$COMMIT_SHA'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=prometheus-staging'

  # Smoke Tests
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'smoke-tests'
    args:
      - 'wait'
      - '--for=condition=ready'
      - 'pod'
      - '-l'
      - 'app=prometheus-ai-platform'
      - '--namespace=prometheus-staging'
      - '--timeout=300s'
    waitFor: ['deploy-staging']

  - name: 'bash'
    id: 'run-smoke-tests'
    args:
      - './scripts/smoke-tests.sh'
      - 'staging'
    waitFor: ['smoke-tests']

# Deployment to production requires manual approval
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/sonar-token/versions/latest
      env: 'SONAR_TOKEN'
    - versionName: projects/$PROJECT_ID/secrets/snyk-token/versions/latest
      env: 'SNYK_TOKEN'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitutionOption: 'ALLOW_LOOSE'

substitutions:
  _SONAR_TOKEN: ''
  _SONAR_HOST_URL: 'https://sonarcloud.io'
  _SONAR_PROJECT_KEY: 'prometheus-ai-platform'

images:
  - 'gcr.io/$PROJECT_ID/helios-core:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/data-ingestion:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/volcano-watchtower:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/api-gateway:$COMMIT_SHA'

artifacts:
  objects:
    location: 'gs://$PROJECT_ID-build-artifacts'
    paths:
      - 'trivy-*.sarif'
      - 'services/*/coverage.xml'
      - 'services/*/report.xml'