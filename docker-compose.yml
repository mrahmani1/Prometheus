version: '3.8'

services:
  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    depends_on:
      - consul
      - redis
    networks:
      - prometheus-network

  # Service Discovery
  consul:
    image: consul:1.15
    ports:
      - "8500:8500"
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    volumes:
      - consul-data:/consul/data
    networks:
      - prometheus-network

  # Helios Core Service
  helios-core:
    build:
      context: ./services/helios-core
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/app
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - INFLUXDB_HOST=influxdb
      - POSTGRES_HOST=postgres
      - NEO4J_HOST=neo4j
      - REDIS_HOST=redis
    depends_on:
      - consul
      - influxdb
      - postgres
      - neo4j
      - redis
    networks:
      - prometheus-network

  # Data Ingestion Service
  data-ingestion:
    build:
      context: ./services/data-ingestion
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/app
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - KAFKA_BROKERS=kafka:9092
      - INFLUXDB_HOST=influxdb
    depends_on:
      - consul
      - kafka
      - influxdb
    networks:
      - prometheus-network

  # Simulation Service
  simulation-service:
    build:
      context: ./services/simulation
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/app
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - POSTGRES_HOST=postgres
      - NEO4J_HOST=neo4j
    depends_on:
      - consul
      - postgres
      - neo4j
    networks:
      - prometheus-network

  # Real-time Processing Service
  realtime-processor:
    build:
      context: ./services/realtime-processor
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/app
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis
    depends_on:
      - consul
      - kafka
      - redis
    networks:
      - prometheus-network

  # Volcano Watchtower Service
  volcano-watchtower:
    build:
      context: ./services/volcano-watchtower
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/app
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - KAFKA_BROKERS=kafka:9092
      - INFLUXDB_HOST=influxdb
    depends_on:
      - consul
      - kafka
      - influxdb
    networks:
      - prometheus-network

  # TimescaleDB Service
  timescale-db-service:
    build:
      context: ./services/timescale-db
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/app
      - TIMESCALE_DATABASE_URL=postgresql://prometheus:prometheus123@timescaledb:5432/prometheus_timeseries
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    depends_on:
      - timescaledb
    networks:
      - prometheus-network

  # Databases
  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=prometheus123
      - DOCKER_INFLUXDB_INIT_ORG=prometheus
      - DOCKER_INFLUXDB_INIT_BUCKET=geological-data
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - prometheus-network

  postgres:
    image: postgis/postgis:15-3.3
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=prometheus
      - POSTGRES_USER=prometheus
      - POSTGRES_PASSWORD=prometheus123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - prometheus-network

  # TimescaleDB for time-series data
  timescaledb:
    image: timescale/timescaledb:2.12.1-pg15
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=prometheus_timeseries
      - POSTGRES_USER=prometheus
      - POSTGRES_PASSWORD=prometheus123
      - PGDATA=/var/lib/postgresql/data/pgdata
      - TS_TUNE_MEMORY=2GB
      - TS_TUNE_NUM_CPUS=2
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./database/timescale/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - prometheus-network

  neo4j:
    image: neo4j:5.12
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/prometheus123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - prometheus-network

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - prometheus-network

  # Message Streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - prometheus-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - prometheus-network

volumes:
  consul-data:
  influxdb-data:
  postgres-data:
  timescaledb-data:
  neo4j-data:
  neo4j-logs:
  redis-data:
  kafka-data:

networks:
  prometheus-network:
    driver: bridge