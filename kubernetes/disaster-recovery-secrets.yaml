apiVersion: v1
kind: Secret
metadata:
  name: disaster-recovery-secrets
  namespace: prometheus-ai
  labels:
    app: disaster-recovery
    component: infrastructure
type: Opaque
stringData:
  # GCP Configuration
  gcp-project-id: "prometheus-ai-platform"
  
  # Azure Configuration
  azure-subscription-id: "your-azure-subscription-id"
  azure-tenant-id: "your-azure-tenant-id"
  
  # AWS Configuration
  aws-account-id: "123456789012"
  aws-access-key-id: "your-aws-access-key-id"
  aws-secret-access-key: "your-aws-secret-access-key"
  
  # Database Configuration
  database-url: "postgresql://prometheus:prometheus123@postgres:5432/prometheus_dr"
  redis-url: "redis://redis:6379/0"
  
  # Authentication
  jwt-secret-key: "your-super-secret-jwt-key-change-in-production"
  
  # External API Keys (if needed)
  monitoring-api-key: "your-monitoring-api-key"
  alerting-webhook-url: "https://hooks.slack.com/services/your/webhook/url"

---
apiVersion: v1
kind: Secret
metadata:
  name: gcp-service-account-key
  namespace: prometheus-ai
  labels:
    app: disaster-recovery
    component: infrastructure
type: Opaque
data:
  # Base64 encoded GCP service account key JSON
  # Replace with actual service account key
  key.json: 

---
apiVersion: v1
kind: Secret
metadata:
  name: azure-credentials
  namespace: prometheus-ai
  labels:
    app: disaster-recovery
    component: infrastructure
type: Opaque
stringData:
  # Azure Service Principal credentials
  client-id: "your-azure-client-id"
  client-secret: "your-azure-client-secret"
  tenant-id: "your-azure-tenant-id"
  subscription-id: "your-azure-subscription-id"

---
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: prometheus-ai
  labels:
    app: disaster-recovery
    component: infrastructure
type: Opaque
stringData:
  # AWS IAM credentials
  access-key-id: "your-aws-access-key-id"
  secret-access-key: "your-aws-secret-access-key"
  session-token: "your-aws-session-token"  # Optional for temporary credentials
  region: "us-east-1"