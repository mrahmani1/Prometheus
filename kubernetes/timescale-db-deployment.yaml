apiVersion: apps/v1
kind: Deployment
metadata:
  name: timescale-db-service
  namespace: prometheus-ai
  labels:
    app: timescale-db-service
    component: database
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: timescale-db-service
  template:
    metadata:
      labels:
        app: timescale-db-service
        component: database
        version: v1.0.0
    spec:
      containers:
      - name: timescale-db-service
        image: prometheus-ai/timescale-db-service:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: TIMESCALE_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: timescale-url
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: timescale-db-config
      restartPolicy: Always
      imagePullPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: timescale-db-service
  namespace: prometheus-ai
  labels:
    app: timescale-db-service
    component: database
spec:
  selector:
    app: timescale-db-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: timescale-db-config
  namespace: prometheus-ai
data:
  config.yaml: |
    database:
      pool_size: 20
      max_connections: 100
      connection_timeout: 60
      query_timeout: 300
    
    compression:
      sensor_readings_days: 7
      seismic_events_days: 30
      volcanic_monitoring_days: 14
      geochemical_samples_days: 90
    
    retention:
      sensor_readings_years: 5
      seismic_events_years: 10
      volcanic_monitoring_years: 7
      geochemical_samples_years: 20
    
    continuous_aggregates:
      refresh_interval_hours: 1
      refresh_lag_hours: 1
      refresh_start_offset_hours: 3
    
    monitoring:
      health_check_interval: 30
      metrics_collection_interval: 60
      alert_thresholds:
        connection_pool_usage: 0.8
        query_duration_seconds: 10
        error_rate_percent: 5

---
apiVersion: v1
kind: Secret
metadata:
  name: timescale-db-secrets
  namespace: prometheus-ai
type: Opaque
data:
  # Base64 encoded database credentials
  # These should be replaced with actual values in production
  database-url: cG9zdGdyZXNxbDovL3Byb21ldGhldXM6cHJvbWV0aGV1czEyM0B0aW1lc2NhbGVkYjo1NDMyL3Byb21ldGhldXNfdGltZXNlcmllcw==
  username: cHJvbWV0aGV1cw==
  password: cHJvbWV0aGV1czEyMw==

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: timescale-db-service-network-policy
  namespace: prometheus-ai
spec:
  podSelector:
    matchLabels:
      app: timescale-db-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          component: api-gateway
    - podSelector:
        matchLabels:
          component: data-ingestion
    - podSelector:
        matchLabels:
          component: volcano-watchtower
    - podSelector:
        matchLabels:
          component: helios-core
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: timescaledb
    ports:
    - protocol: TCP
      port: 5432
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: timescale-db-service-hpa
  namespace: prometheus-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: timescale-db-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60