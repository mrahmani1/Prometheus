# Disaster Recovery and Backup Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-config
  namespace: prometheus-ai
data:
  # Backup schedules (cron format)
  postgres_backup_schedule: "0 */6 * * *"  # Every 6 hours
  influxdb_backup_schedule: "0 */4 * * *"  # Every 4 hours
  neo4j_backup_schedule: "0 */6 * * *"     # Every 6 hours
  
  # Retention policies
  backup_retention_days: "30"
  archive_retention_days: "365"
  
  # Cross-region replication
  enable_cross_region: "true"
  primary_region: "us-west-2"
  backup_regions: "us-east-1,eu-west-1"
  
  # Backup storage
  backup_storage_class: "glacier"
  backup_encryption: "true"

---
# PostgreSQL Backup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: prometheus-ai
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: postgres-backup
            image: postgres:15
            env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: prometheus-config
                  key: POSTGRES_HOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: prometheus-config
                  key: POSTGRES_PORT
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: prometheus-config
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: prometheus-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: prometheus-secrets
                  key: POSTGRES_PASSWORD
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backup-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: BACKUP_BUCKET
              value: "prometheus-ai-backups"
            command:
            - /bin/bash
            - -c
            - |
              set -e
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_FILE="postgres_backup_${TIMESTAMP}.sql.gz"
              
              echo "Starting PostgreSQL backup at $(date)"
              
              # Create backup with compression
              pg_dump --verbose --no-owner --no-privileges | gzip > /tmp/${BACKUP_FILE}
              
              # Upload to S3 with encryption
              aws s3 cp /tmp/${BACKUP_FILE} s3://${BACKUP_BUCKET}/postgres/${BACKUP_FILE} \
                --server-side-encryption AES256 \
                --storage-class STANDARD_IA
              
              # Cross-region replication
              aws s3 cp s3://${BACKUP_BUCKET}/postgres/${BACKUP_FILE} \
                s3://${BACKUP_BUCKET}-us-east-1/postgres/${BACKUP_FILE} \
                --source-region us-west-2 --region us-east-1
              
              # Cleanup old backups (keep last 30 days)
              aws s3 ls s3://${BACKUP_BUCKET}/postgres/ | \
                awk '$1 < "'$(date -d '30 days ago' '+%Y-%m-%d')'" {print $4}' | \
                xargs -I {} aws s3 rm s3://${BACKUP_BUCKET}/postgres/{}
              
              echo "PostgreSQL backup completed successfully"
            volumeMounts:
            - name: backup-temp
              mountPath: /tmp
          volumes:
          - name: backup-temp
            emptyDir: {}

---
# InfluxDB Backup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: influxdb-backup
  namespace: prometheus-ai
spec:
  schedule: "0 */4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: influxdb-backup
            image: influxdb:2.7
            env:
            - name: INFLUX_HOST
              valueFrom:
                configMapKeyRef:
                  name: prometheus-config
                  key: INFLUXDB_HOST
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backup-secrets
                  key: INFLUXDB_ADMIN_TOKEN
            - name: INFLUX_ORG
              valueFrom:
                secretKeyRef:
                  name: prometheus-secrets
                  key: INFLUXDB_ORG
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backup-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: BACKUP_BUCKET
              value: "prometheus-ai-backups"
            command:
            - /bin/bash
            - -c
            - |
              set -e
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_DIR="/tmp/influxdb_backup_${TIMESTAMP}"
              BACKUP_FILE="influxdb_backup_${TIMESTAMP}.tar.gz"
              
              echo "Starting InfluxDB backup at $(date)"
              
              # Create backup directory
              mkdir -p ${BACKUP_DIR}
              
              # Backup all buckets
              influx backup ${BACKUP_DIR} \
                --host http://${INFLUX_HOST}:8086 \
                --token ${INFLUX_TOKEN} \
                --org ${INFLUX_ORG}
              
              # Compress backup
              tar -czf /tmp/${BACKUP_FILE} -C /tmp influxdb_backup_${TIMESTAMP}
              
              # Upload to S3
              aws s3 cp /tmp/${BACKUP_FILE} s3://${BACKUP_BUCKET}/influxdb/${BACKUP_FILE} \
                --server-side-encryption AES256 \
                --storage-class STANDARD_IA
              
              # Cross-region replication
              aws s3 cp s3://${BACKUP_BUCKET}/influxdb/${BACKUP_FILE} \
                s3://${BACKUP_BUCKET}-us-east-1/influxdb/${BACKUP_FILE} \
                --source-region us-west-2 --region us-east-1
              
              # Cleanup
              rm -rf ${BACKUP_DIR} /tmp/${BACKUP_FILE}
              
              echo "InfluxDB backup completed successfully"
            volumeMounts:
            - name: backup-temp
              mountPath: /tmp
          volumes:
          - name: backup-temp
            emptyDir:
              sizeLimit: 10Gi

---
# Neo4j Backup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: neo4j-backup
  namespace: prometheus-ai
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: neo4j-backup
            image: neo4j:5.12
            env:
            - name: NEO4J_HOST
              valueFrom:
                configMapKeyRef:
                  name: prometheus-config
                  key: NEO4J_HOST
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: prometheus-secrets
                  key: NEO4J_AUTH
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backup-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: BACKUP_BUCKET
              value: "prometheus-ai-backups"
            command:
            - /bin/bash
            - -c
            - |
              set -e
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_FILE="neo4j_backup_${TIMESTAMP}.dump"
              
              echo "Starting Neo4j backup at $(date)"
              
              # Create database dump
              cypher-shell -a bolt://${NEO4J_HOST}:7687 -u neo4j -p $(echo ${NEO4J_AUTH} | cut -d: -f2) \
                "CALL apoc.export.cypher.all('/tmp/${BACKUP_FILE}', {format: 'cypher-shell', useOptimizations: {type: 'UNWIND_BATCH', unwindBatchSize: 20}})"
              
              # Compress backup
              gzip /tmp/${BACKUP_FILE}
              
              # Upload to S3
              aws s3 cp /tmp/${BACKUP_FILE}.gz s3://${BACKUP_BUCKET}/neo4j/${BACKUP_FILE}.gz \
                --server-side-encryption AES256 \
                --storage-class STANDARD_IA
              
              # Cross-region replication
              aws s3 cp s3://${BACKUP_BUCKET}/neo4j/${BACKUP_FILE}.gz \
                s3://${BACKUP_BUCKET}-us-east-1/neo4j/${BACKUP_FILE}.gz \
                --source-region us-west-2 --region us-east-1
              
              echo "Neo4j backup completed successfully"
            volumeMounts:
            - name: backup-temp
              mountPath: /tmp
          volumes:
          - name: backup-temp
            emptyDir: {}

---
# Disaster Recovery Secrets
apiVersion: v1
kind: Secret
metadata:
  name: backup-secrets
  namespace: prometheus-ai
type: Opaque
data:
  # Base64 encoded AWS credentials for backup storage
  AWS_ACCESS_KEY_ID: QUtJQUlPU0ZPRE5ON0VYQU1QTEU=  # AKIAIOSFODNN7EXAMPLE
  AWS_SECRET_ACCESS_KEY: d0phbHJYVXRuRkVNSS9LN01ERU5HL2JQeFJmaUNZRVhBTVBMRUtFWQ==  # wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  INFLUXDB_ADMIN_TOKEN: YWRtaW5fdG9rZW5fZXhhbXBsZQ==  # admin_token_example

---
# Disaster Recovery Monitoring
apiVersion: v1
kind: Service
metadata:
  name: backup-monitor
  namespace: prometheus-ai
spec:
  selector:
    app: backup-monitor
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-monitor
  namespace: prometheus-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backup-monitor
  template:
    metadata:
      labels:
        app: backup-monitor
    spec:
      containers:
      - name: backup-monitor
        image: prometheus/backup-monitor:latest
        ports:
        - containerPort: 8080
        env:
        - name: BACKUP_BUCKET
          value: "prometheus-ai-backups"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: AWS_SECRET_ACCESS_KEY
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5