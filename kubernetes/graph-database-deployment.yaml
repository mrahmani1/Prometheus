# Graph Database Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-database
  namespace: prometheus-ai
  labels:
    app: graph-database
    component: backend
    tier: data
spec:
  replicas: 2
  selector:
    matchLabels:
      app: graph-database
  template:
    metadata:
      labels:
        app: graph-database
        component: backend
        tier: data
    spec:
      containers:
      - name: graph-database
        image: prometheus-ai/graph-database:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: prometheus-config
              key: ENVIRONMENT
        - name: NEO4J_URI
          value: "bolt://neo4j-service:7687"
        - name: NEO4J_USER
          valueFrom:
            secretKeyRef:
              name: prometheus-secrets
              key: NEO4J_USER
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: prometheus-secrets
              key: NEO4J_PASSWORD
        - name: NEO4J_DATABASE
          valueFrom:
            configMapKeyRef:
              name: prometheus-config
              key: NEO4J_DATABASE
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: prometheus-config
              key: LOG_LEVEL
        - name: QUERY_TIMEOUT
          value: "300"
        - name: MAX_CONNECTION_POOL_SIZE
          value: "50"
        - name: CONNECTION_ACQUISITION_TIMEOUT
          value: "60"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: app-logs
          mountPath: /app/logs
      volumes:
      - name: app-logs
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: graph-database-service
  namespace: prometheus-ai
  labels:
    app: graph-database
spec:
  selector:
    app: graph-database
  ports:
  - name: http
    protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
---
# Horizontal Pod Autoscaler for Graph Database Service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: graph-database-hpa
  namespace: prometheus-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: graph-database
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
# Network Policy for Graph Database Service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: graph-database-network-policy
  namespace: prometheus-ai
spec:
  podSelector:
    matchLabels:
      app: graph-database
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    - podSelector:
        matchLabels:
          app: helios-core
    - podSelector:
        matchLabels:
          app: volcano-watchtower
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: neo4j
    ports:
    - protocol: TCP
      port: 7687
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53