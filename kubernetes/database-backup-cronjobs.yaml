apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: prometheus-ai
  labels:
    app: postgres-backup
    component: backup
    tier: maintenance
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: postgres-backup
            component: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          containers:
          - name: postgres-backup
            image: postgres:15-alpine
            command:
            - /bin/sh
            - -c
            - |
              set -e
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_FILE="/backups/postgres_backup_${TIMESTAMP}.sql.gz"
              
              echo "Starting PostgreSQL backup at $(date)"
              
              # Create backup with compression
              pg_dump -h postgres -U $POSTGRES_USER -d $POSTGRES_DB \
                --verbose --no-password --format=custom --compress=9 \
                --file=/tmp/backup.dump
              
              # Compress and move to backup storage
              gzip -c /tmp/backup.dump > $BACKUP_FILE
              
              # Verify backup integrity
              pg_restore --list $BACKUP_FILE > /dev/null
              
              echo "Backup completed successfully: $BACKUP_FILE"
              
              # Cleanup old backups (keep last 30 days)
              find /backups -name "postgres_backup_*.sql.gz" -mtime +30 -delete
              
              # Log backup size and completion
              BACKUP_SIZE=$(du -h $BACKUP_FILE | cut -f1)
              echo "Backup size: $BACKUP_SIZE"
              
              # Send backup metrics to monitoring
              curl -X POST http://prometheus-pushgateway:9091/metrics/job/postgres-backup \
                -d "postgres_backup_size_bytes $(stat -c%s $BACKUP_FILE)"
                
            env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: postgres-user
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: postgres-db
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: postgres-password
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "1Gi"
                cpu: "500m"
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: database-backup-storage
---
