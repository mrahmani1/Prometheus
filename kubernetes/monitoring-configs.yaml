# Configuration Files for Advanced Monitoring System

---
# OpenTelemetry Collector Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: prometheus-ai
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 10s
              static_configs:
                - targets: ['0.0.0.0:8888']
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_http:
            endpoint: 0.0.0.0:14268
          thrift_compact:
            endpoint: 0.0.0.0:6831
          thrift_binary:
            endpoint: 0.0.0.0:6832
      zipkin:
        endpoint: 0.0.0.0:9411

    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
      memory_limiter:
        limit_mib: 512
      resource:
        attributes:
          - key: service.name
            value: prometheus-ai-platform
            action: upsert
          - key: service.version
            value: "1.0.0"
            action: upsert
          - key: deployment.environment
            value: "production"
            action: upsert
      attributes:
        actions:
          - key: geological.module
            action: insert
            from_attribute: module_name
          - key: geological.data_type
            action: insert
            from_attribute: data_type
          - key: geological.processing_stage
            action: insert
            from_attribute: processing_stage

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
        const_labels:
          platform: "prometheus-ai"
      jaeger:
        endpoint: jaeger-service:14250
        tls:
          insecure: true
      elasticsearch:
        endpoints: ["http://elasticsearch-service:9200"]
        logs_index: "otel-logs"
        traces_index: "otel-traces"
        metrics_index: "otel-metrics"
      # Google Cloud Monitoring
      googlecloud:
        project: "${GOOGLE_CLOUD_PROJECT}"
        metric:
          prefix: "prometheus-ai/"
        trace:
          project: "${GOOGLE_CLOUD_PROJECT}"
      # Azure Monitor
      azuremonitor:
        instrumentation_key: "${AZURE_INSTRUMENTATION_KEY}"
        maxbatchsize: 100
        maxbatchinterval: 10s
      # AWS CloudWatch
      awscloudwatch:
        region: "${AWS_REGION}"
        namespace: "PrometheusAI"
        dimension_rollup_option: "NoDimensionRollup"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      pprof:
        endpoint: 0.0.0.0:1777
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      extensions: [health_check, pprof, zpages]
      pipelines:
        traces:
          receivers: [otlp, jaeger, zipkin]
          processors: [memory_limiter, resource, attributes, batch]
          exporters: [jaeger, googlecloud, azuremonitor]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheus, googlecloud, azuremonitor, awscloudwatch]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, attributes, batch]
          exporters: [elasticsearch, googlecloud, azuremonitor]

---
# Logstash Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: prometheus-ai
data:
  logstash.conf: |
    input {
      beats {
        port => 5044
      }
      http {
        port => 8080
        codec => json
      }
    }

    filter {
      # Parse JSON logs
      if [fields][log_type] == "application" {
        json {
          source => "message"
        }
      }

      # Add geological context
      if [kubernetes][labels][app] {
        mutate {
          add_field => { "geological_service" => "%{[kubernetes][labels][app]}" }
        }
      }

      # Parse geological data quality metrics
      if [geological_data_quality] {
        ruby {
          code => "
            quality = event.get('geological_data_quality')
            if quality.is_a?(Hash)
              event.set('data_quality_score', quality['score'] || 0)
              event.set('data_completeness', quality['completeness'] || 0)
              event.set('data_accuracy', quality['accuracy'] || 0)
            end
          "
        }
      }

      # Parse volcanic monitoring alerts
      if [alert_type] == "volcanic" {
        mutate {
          add_field => { "alert_priority" => "high" }
          add_tag => [ "volcanic_alert" ]
        }
      }

      # Parse seismic events
      if [event_type] == "seismic" {
        ruby {
          code => "
            magnitude = event.get('magnitude')
            if magnitude
              if magnitude.to_f >= 5.0
                event.set('seismic_severity', 'major')
                event.tag('major_seismic_event')
              elsif magnitude.to_f >= 3.0
                event.set('seismic_severity', 'moderate')
              else
                event.set('seismic_severity', 'minor')
              end
            end
          "
        }
      }

      # Add timestamp processing
      date {
        match => [ "timestamp", "ISO8601" ]
        target => "@timestamp"
      }

      # Geoip processing for location data
      if [client_ip] {
        geoip {
          source => "client_ip"
          target => "geoip"
        }
      }

      # Performance metrics processing
      if [response_time] {
        ruby {
          code => "
            response_time = event.get('response_time')
            if response_time
              if response_time.to_f > 5000
                event.set('performance_category', 'slow')
                event.tag('slow_response')
              elsif response_time.to_f > 1000
                event.set('performance_category', 'moderate')
              else
                event.set('performance_category', 'fast')
              end
            end
          "
        }
      }
    }

    output {
      elasticsearch {
        hosts => ["elasticsearch-service:9200"]
        index => "prometheus-ai-logs-%{+YYYY.MM.dd}"
        template_name => "prometheus-ai"
        template => "/usr/share/logstash/templates/prometheus-ai-template.json"
        template_overwrite => true
      }

      # Send critical alerts to external systems
      if "volcanic_alert" in [tags] or "major_seismic_event" in [tags] {
        http {
          url => "${ALERT_WEBHOOK_URL}"
          http_method => "post"
          format => "json"
          headers => {
            "Authorization" => "Bearer ${ALERT_API_TOKEN}"
            "Content-Type" => "application/json"
          }
        }
      }

      # Debug output for development
      if [log_level] == "debug" {
        stdout {
          codec => rubydebug
        }
      }
    }

---
# Logstash Settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-settings
  namespace: prometheus-ai
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    path.config: /usr/share/logstash/pipeline
    path.data: /usr/share/logstash/data
    pipeline.workers: 4
    pipeline.batch.size: 1000
    pipeline.batch.delay: 50
    queue.type: persisted
    queue.max_bytes: 1gb
    dead_letter_queue.enable: true
    log.level: info
    monitoring.enabled: true
    monitoring.elasticsearch.hosts: ["http://elasticsearch-service:9200"]

---
# Filebeat Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: prometheus-ai
data:
  filebeat.yml: |
    filebeat.inputs:
    - type: container
      paths:
        - /var/log/containers/*prometheus-ai*.log
      processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
          - logs_path:
              logs_path: "/var/log/containers/"
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true
      - add_fields:
          target: fields
          fields:
            log_type: application
            platform: prometheus-ai

    - type: log
      paths:
        - /var/log/syslog
        - /var/log/messages
      fields:
        log_type: system
        platform: prometheus-ai
      fields_under_root: true

    processors:
    - add_host_metadata:
        when.not.contains.tags: forwarded
    - add_cloud_metadata: ~
    - add_docker_metadata: ~

    output.logstash:
      hosts: ["logstash-service:5044"]

    setup.template.settings:
      index.number_of_shards: 3
      index.number_of_replicas: 1

    logging.level: info
    logging.to_files: true
    logging.files:
      path: /var/log/filebeat
      name: filebeat
      keepfiles: 7
      permissions: 0644

---
# AlertManager Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: prometheus-ai
data:
  config.yml: |
    global:
      smtp_smarthost: '${SMTP_HOST}:587'
      smtp_from: 'alerts@prometheus-ai.com'
      smtp_auth_username: '${SMTP_USERNAME}'
      smtp_auth_password: '${SMTP_PASSWORD}'
      slack_api_url: '${SLACK_WEBHOOK_URL}'
      pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

    templates:
    - '/etc/alertmanager/templates/*.tmpl'

    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'default'
      routes:
      - match:
          severity: critical
        receiver: 'critical-alerts'
        group_wait: 5s
        repeat_interval: 5m
      - match:
          alert_type: volcanic
        receiver: 'volcanic-alerts'
        group_wait: 1s
        repeat_interval: 1m
      - match:
          alert_type: seismic
        receiver: 'seismic-alerts'
        group_wait: 1s
        repeat_interval: 2m
      - match:
          service: helios-core
        receiver: 'ai-service-alerts'
      - match:
          service: volcano-watchtower
        receiver: 'monitoring-alerts'

    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'cluster', 'service']

    receivers:
    - name: 'default'
      email_configs:
      - to: 'team@prometheus-ai.com'
        subject: 'Prometheus AI Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
          {{ end }}

    - name: 'critical-alerts'
      email_configs:
      - to: 'oncall@prometheus-ai.com'
        subject: 'CRITICAL: {{ .GroupLabels.alertname }}'
        body: |
          CRITICAL ALERT TRIGGERED
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Time: {{ .StartsAt }}
          {{ end }}
      slack_configs:
      - channel: '#critical-alerts'
        title: 'Critical Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Service:* {{ .Labels.service }}
          *Severity:* {{ .Labels.severity }}
          {{ end }}
      pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY}'
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'

    - name: 'volcanic-alerts'
      email_configs:
      - to: 'volcanology@prometheus-ai.com'
        subject: 'Volcanic Alert: {{ .GroupLabels.alertname }}'
        body: |
          VOLCANIC MONITORING ALERT
          
          {{ range .Alerts }}
          Volcano: {{ .Labels.volcano_name }}
          Alert Type: {{ .Labels.alert_type }}
          Magnitude: {{ .Labels.magnitude }}
          Location: {{ .Labels.latitude }}, {{ .Labels.longitude }}
          Time: {{ .StartsAt }}
          Description: {{ .Annotations.description }}
          {{ end }}
      slack_configs:
      - channel: '#volcanic-monitoring'
        title: 'Volcanic Alert'
        text: |
          {{ range .Alerts }}
          🌋 *Volcanic Activity Detected*
          *Volcano:* {{ .Labels.volcano_name }}
          *Type:* {{ .Labels.alert_type }}
          *Magnitude:* {{ .Labels.magnitude }}
          *Location:* {{ .Labels.latitude }}, {{ .Labels.longitude }}
          {{ end }}

    - name: 'seismic-alerts'
      email_configs:
      - to: 'seismology@prometheus-ai.com'
        subject: 'Seismic Alert: {{ .GroupLabels.alertname }}'
        body: |
          SEISMIC EVENT DETECTED
          
          {{ range .Alerts }}
          Magnitude: {{ .Labels.magnitude }}
          Depth: {{ .Labels.depth }}
          Location: {{ .Labels.latitude }}, {{ .Labels.longitude }}
          Time: {{ .StartsAt }}
          Event Type: {{ .Labels.event_type }}
          {{ end }}
      slack_configs:
      - channel: '#seismic-monitoring'
        title: 'Seismic Event'
        text: |
          {{ range .Alerts }}
          🌍 *Seismic Event Detected*
          *Magnitude:* {{ .Labels.magnitude }}
          *Depth:* {{ .Labels.depth }} km
          *Location:* {{ .Labels.latitude }}, {{ .Labels.longitude }}
          *Type:* {{ .Labels.event_type }}
          {{ end }}

    - name: 'ai-service-alerts'
      email_configs:
      - to: 'ai-team@prometheus-ai.com'
        subject: 'AI Service Alert: {{ .GroupLabels.alertname }}'
      slack_configs:
      - channel: '#ai-services'
        title: 'AI Service Alert'

    - name: 'monitoring-alerts'
      email_configs:
      - to: 'monitoring@prometheus-ai.com'
        subject: 'Monitoring Alert: {{ .GroupLabels.alertname }}'
      slack_configs:
      - channel: '#monitoring'
        title: 'Monitoring System Alert'

---
# Service Account for Filebeat
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: prometheus-ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
rules:
- apiGroups: [""]
  resources:
  - nodes
  - namespaces
  - events
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources:
  - deployments
  - replicasets
  - daemonsets
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
subjects:
- kind: ServiceAccount
  name: filebeat
  namespace: prometheus-ai
roleRef:
  kind: ClusterRole
  name: filebeat
  apiGroup: rbac.authorization.k8s.io