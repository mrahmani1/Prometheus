# =============================================================================
# ENHANCED PERSISTENT VOLUMES FOR PROMETHEUS AI PLATFORM
# High-performance storage configuration for geological databases
# =============================================================================

# Enhanced PostgreSQL Persistent Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: enhanced-postgres-pv
  namespace: prometheus-ai
  labels:
    app: enhanced-postgres
    component: database
    storage-tier: high-performance
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fast-ssd
  hostPath:
    path: /data/prometheus-ai/postgres
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: storage-type
          operator: In
          values:
          - ssd
          - nvme

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: enhanced-postgres-pvc
  namespace: prometheus-ai
  labels:
    app: enhanced-postgres
    component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Gi
  storageClassName: fast-ssd
  selector:
    matchLabels:
      app: enhanced-postgres

