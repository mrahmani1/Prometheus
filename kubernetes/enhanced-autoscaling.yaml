---
# ServiceMonitor for Prometheus to scrape custom metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus-ai-services
  namespace: prometheus-ai
  labels:
    app: prometheus-ai
spec:
  selector:
    matchLabels:
      monitoring: "enabled"
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s

---
# PrometheusRule for custom scaling metrics
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scaling-metrics
  namespace: prometheus-ai
spec:
  groups:
  - name: scaling.rules
    rules:
    - alert: HighScalingFrequency
      expr: increase(scaling_actions_total[5m]) > 5
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High scaling frequency detected for {{ $labels.service }}"
        description: "Service {{ $labels.service }} has scaled {{ $value }} times in the last 5 minutes"
    
    - alert: ScalingAtMaxCapacity
      expr: kube_deployment_status_replicas / kube_deployment_spec_replicas > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Service {{ $labels.deployment }} is near maximum capacity"
        description: "Service {{ $labels.deployment }} is running at {{ $value | humanizePercentage }} of maximum capacity"
    
    - alert: ScalingFailure
      expr: increase(scaling_actions_total{success="false"}[10m]) > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Scaling failure detected for {{ $labels.service }}"
        description: "Failed to scale {{ $labels.service }}: {{ $labels.error }}"

---
# Custom metrics for intelligent scaling
apiVersion: v1
kind: ConfigMap
metadata:
  name: scaling-metrics-config
  namespace: prometheus-ai
data:
  metrics.yaml: |
    metrics:
      # API Gateway metrics
      http_requests_per_second:
        query: "rate(http_requests_total[1m])"
        threshold: 100
        
      response_time_p95:
        query: "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))"
        threshold: 2.0
        
      # Helios Core metrics
      ai_model_inference_queue_depth:
        query: "ai_model_inference_queue_size"
        threshold: 50
        
      gpu_utilization:
        query: "nvidia_gpu_utilization_gpu"
        threshold: 75
        
      simulation_processing_time:
        query: "avg(simulation_duration_seconds)"
        threshold: 300
        
      # Volcano Watchtower metrics
      seismic_events_processing_rate:
        query: "rate(seismic_events_processed_total[1m])"
        threshold: 100
        
      volcanic_alert_queue_depth:
        query: "volcanic_alert_queue_size"
        threshold: 10
        
      insar_processing_backlog:
        query: "insar_processing_backlog_count"
        threshold: 5
        
      # Data Ingestion metrics
      kafka_consumer_lag:
        query: "kafka_consumer_lag_sum"
        threshold: 1000
        
      data_processing_queue_depth:
        query: "data_processing_queue_size"
        threshold: 500
        
      satellite_data_backlog_minutes:
        query: "satellite_data_backlog_minutes"
        threshold: 15
        
      # System Monitor metrics
      active_incidents:
        query: "active_incidents_total"
        threshold: 10
        
      health_check_latency:
        query: "avg(health_check_duration_seconds)"
        threshold: 5