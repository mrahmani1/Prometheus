---
# PodDisruptionBudgets for critical services
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: volcano-watchtower-pdb
  namespace: prometheus-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: volcano-watchtower

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: helios-core-pdb
  namespace: prometheus-ai
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: helios-core

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: prometheus-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
