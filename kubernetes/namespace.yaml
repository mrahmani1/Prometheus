apiVersion: v1
kind: Namespace
metadata:
  name: prometheus-ai
  labels:
    name: prometheus-ai
    app.kubernetes.io/name: prometheus-ai-platform
    app.kubernetes.io/version: "1.0.0"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: prometheus-ai-quota
  namespace: prometheus-ai
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "10"
    services: "20"
    secrets: "10"
    configmaps: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: prometheus-ai-limits
  namespace: prometheus-ai
spec:
  limits:
  - default:
      cpu: "2"
      memory: "4Gi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    type: Container