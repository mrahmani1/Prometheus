apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-monitor-deployment
  namespace: prometheus-ai
  labels:
    app: system-monitor
    component: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: system-monitor
  template:
    metadata:
      labels:
        app: system-monitor
        component: monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: system-monitor-sa
      containers:
      - name: system-monitor
        image: prometheus-ai/system-monitor:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: POSTGRES_HOST
          value: "postgresql"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        - name: POSTGRES_DB
          value: "prometheus"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: system-monitor-config
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: system-monitor-service
  namespace: prometheus-ai
  labels:
    app: system-monitor
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: system-monitor
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: system-monitor-sa
  namespace: prometheus-ai

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system-monitor-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch", "create", "patch", "update"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system-monitor-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system-monitor-role
subjects:
- kind: ServiceAccount
  name: system-monitor-sa
  namespace: prometheus-ai

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: system-monitor-config
  namespace: prometheus-ai
data:
  config.yaml: |
    monitoring:
      check_interval: 30
      health_check_timeout: 10
      scaling_check_interval: 60
      
    services:
      api-gateway:
        critical: true
        min_replicas: 2
        max_replicas: 10
        cpu_threshold: 70
        memory_threshold: 80
        
      helios-core:
        critical: true
        min_replicas: 3
        max_replicas: 20
        cpu_threshold: 80
        memory_threshold: 85
        
      volcano-watchtower:
        critical: true
        emergency_service: true
        min_replicas: 2
        max_replicas: 8
        cpu_threshold: 75
        memory_threshold: 80
        
      data-ingestion:
        critical: true
        min_replicas: 2
        max_replicas: 15
        cpu_threshold: 70
        memory_threshold: 75
        
    alerting:
      escalation_levels:
        - level: 1
          timeout_minutes: 15
          actions: ["restart", "scale_up"]
        - level: 2
          timeout_minutes: 30
          actions: ["notify_oncall", "failover"]
        - level: 3
          timeout_minutes: 60
          actions: ["escalate_to_management"]
          
    incident_response:
      cooldown_minutes: 5
      max_actions_per_hour: 10
      emergency_services: ["volcano-watchtower"]

---
# HorizontalPodAutoscaler for system-monitor
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: system-monitor-hpa
  namespace: prometheus-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: system-monitor-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60