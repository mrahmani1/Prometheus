# Kubernetes Security Manifests for Database Security and Compliance Framework
# Includes RBAC, Network Policies, Pod Security Standards, and Security Monitoring

apiVersion: v1
kind: Namespace
metadata:
  name: prometheus-security
  labels:
    name: prometheus-security
    security.prometheus.ai/level: "high"
    compliance.prometheus.ai/standards: "soc2,gdpr,iso27001"

---
# Service Account for Security Framework
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-security-sa
  namespace: prometheus-security
  labels:
    app: prometheus-security
automountServiceAccountToken: true

---
# RBAC ClusterRole for Security Framework
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-security-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "secrets", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["policy"]
  resources: ["podsecuritypolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]

---
# RBAC ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-security-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-security-role
subjects:
- kind: ServiceAccount
  name: prometheus-security-sa
  namespace: prometheus-security

---
# Security Configuration Secret
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-security-config
  namespace: prometheus-security
  labels:
    app: prometheus-security
type: Opaque
stringData:
  security-config.yaml: |
    encryption:
      type: "aes_256_gcm"
      key_rotation_days: 90
    rbac:
      session_timeout_minutes: 480
      max_failed_login_attempts: 5
    audit_logging:
      enabled: true
      encrypt_audit_logs: true
      retention_days: 365
    vulnerability_scanning:
      enabled: true
      scan_interval_hours: 24
    compliance:
      enabled_standards: ["SOC2", "GDPR", "ISO_27001"]
    incident_response:
      enabled: true
      auto_response: true

---
# Database Credentials Secret
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: prometheus-security
  labels:
    app: prometheus-security
type: Opaque
stringData:
  postgres-username: "prometheus_secure"
  postgres-password: "CHANGE_ME_SECURE_PASSWORD"
  influxdb-token: "CHANGE_ME_INFLUXDB_TOKEN"
  redis-password: "CHANGE_ME_REDIS_PASSWORD"
  neo4j-password: "CHANGE_ME_NEO4J_PASSWORD"
  timescaledb-password: "CHANGE_ME_TIMESCALEDB_PASSWORD"

---
# TLS Certificates Secret
apiVersion: v1
kind: Secret
metadata:
  name: database-tls-certs
  namespace: prometheus-security
  labels:
    app: prometheus-security
type: kubernetes.io/tls
data:
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t  # Base64 encoded certificate
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t  # Base64 encoded private key
  ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t   # Base64 encoded CA certificate

---
# Security Framework ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: security-framework-config
  namespace: prometheus-security
  labels:
    app: prometheus-security
data:
  monitoring-config.yaml: |
    monitoring:
      enabled: true
      real_time_monitoring: true
      alert_thresholds:
        failed_login_rate: 10
        suspicious_query_rate: 5
        data_access_volume: 1000
      metrics_retention_days: 30
  compliance-rules.yaml: |
    compliance_rules:
      SOC2:
        - requirement_id: "CC6.1"
          description: "Logical and physical access controls"
        - requirement_id: "CC6.7"
          description: "Data transmission and disposal"
      GDPR:
        - requirement_id: "Art32"
          description: "Security of processing"
        - requirement_id: "Art30"
          description: "Records of processing activities"

---
# Network Policy for Database Security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-security-network-policy
  namespace: prometheus-security
spec:
  podSelector:
    matchLabels:
      app: prometheus-database
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: prometheus-ai
    - podSelector:
        matchLabels:
          security.prometheus.ai/access: "database"
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 8086  # InfluxDB
    - protocol: TCP
      port: 6379  # Redis
    - protocol: TCP
      port: 7687  # Neo4j Bolt
    - protocol: TCP
      port: 5433  # TimescaleDB
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 53   # DNS
    - protocol: UDP
      port: 53   # DNS
    - protocol: TCP
      port: 443  # HTTPS for external APIs
    - protocol: TCP
      port: 80   # HTTP for health checks

---
# Pod Security Policy
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: prometheus-security-psp
  namespace: prometheus-security
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

---
# Security Framework Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-security-framework
  namespace: prometheus-security
  labels:
    app: prometheus-security
    component: security-framework
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prometheus-security
      component: security-framework
  template:
    metadata:
      labels:
        app: prometheus-security
        component: security-framework
        security.prometheus.ai/level: "high"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: prometheus-security-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: security-framework
        image: prometheus-ai/security-framework:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8443
          name: https
          protocol: TCP
        env:
        - name: POSTGRES_HOST
          value: "postgresql-secure"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: postgres-username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: postgres-password
        - name: INFLUXDB_TOKEN
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: influxdb-token
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: redis-password
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: neo4j-password
        - name: SECURITY_CONFIG_PATH
          value: "/app/config/security-config.yaml"
        - name: LOG_LEVEL
          value: "INFO"
        volumeMounts:
        - name: security-config
          mountPath: /app/config
          readOnly: true
        - name: tls-certs
          mountPath: /app/certs
          readOnly: true
        - name: audit-logs
          mountPath: /var/log/prometheus
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: security-config
        secret:
          secretName: prometheus-security-config
      - name: tls-certs
        secret:
          secretName: database-tls-certs
      - name: audit-logs
        persistentVolumeClaim:
          claimName: audit-logs-pvc
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
# Audit Logs Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audit-logs-pvc
  namespace: prometheus-security
  labels:
    app: prometheus-security
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd

---
# Security Monitoring Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus-security-service
  namespace: prometheus-security
  labels:
    app: prometheus-security
    component: security-framework
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 8443
    targetPort: 8443
    protocol: TCP
    name: https
  selector:
    app: prometheus-security
    component: security-framework

---
# Vulnerability Scanner CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vulnerability-scanner
  namespace: prometheus-security
  labels:
    app: prometheus-security
    component: vulnerability-scanner
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: prometheus-security
            component: vulnerability-scanner
        spec:
          serviceAccountName: prometheus-security-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
          - name: vulnerability-scanner
            image: prometheus-ai/vulnerability-scanner:latest
            imagePullPolicy: Always
            env:
            - name: SCAN_TARGET
              value: "all-databases"
            - name: REPORT_FORMAT
              value: "json"
            - name: OUTPUT_PATH
              value: "/reports"
            volumeMounts:
            - name: scan-reports
              mountPath: /reports
            - name: security-config
              mountPath: /app/config
              readOnly: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "200m"
          volumes:
          - name: scan-reports
            persistentVolumeClaim:
              claimName: scan-reports-pvc
          - name: security-config
            secret:
              secretName: prometheus-security-config
          restartPolicy: OnFailure

---
# Scan Reports Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scan-reports-pvc
  namespace: prometheus-security
  labels:
    app: prometheus-security
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
# Compliance Audit CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: compliance-auditor
  namespace: prometheus-security
  labels:
    app: prometheus-security
    component: compliance-auditor
spec:
  schedule: "0 1 1 * *"  # Monthly on the 1st at 1 AM
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: prometheus-security
            component: compliance-auditor
        spec:
          serviceAccountName: prometheus-security-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
          - name: compliance-auditor
            image: prometheus-ai/compliance-auditor:latest
            imagePullPolicy: Always
            env:
            - name: COMPLIANCE_STANDARDS
              value: "SOC2,GDPR,ISO27001"
            - name: AUDIT_SCOPE
              value: "all-databases"
            - name: REPORT_FORMAT
              value: "pdf,json"
            - name: OUTPUT_PATH
              value: "/reports"
            volumeMounts:
            - name: compliance-reports
              mountPath: /reports
            - name: security-config
              mountPath: /app/config
              readOnly: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                memory: "512Mi"
                cpu: "200m"
              limits:
                memory: "1Gi"
                cpu: "400m"
          volumes:
          - name: compliance-reports
            persistentVolumeClaim:
              claimName: compliance-reports-pvc
          - name: security-config
            secret:
              secretName: prometheus-security-config
          restartPolicy: OnFailure

---
# Compliance Reports Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: compliance-reports-pvc
  namespace: prometheus-security
  labels:
    app: prometheus-security
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
# Security Metrics ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus-security-metrics
  namespace: prometheus-security
  labels:
    app: prometheus-security
spec:
  selector:
    matchLabels:
      app: prometheus-security
      component: security-framework
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s

---
# Security Alerts PrometheusRule
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prometheus-security-alerts
  namespace: prometheus-security
  labels:
    app: prometheus-security
spec:
  groups:
  - name: security.rules
    rules:
    - alert: HighFailedLoginRate
      expr: rate(security_failed_logins_total[5m]) > 0.1
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High failed login rate detected"
        description: "Failed login rate is {{ $value }} per second"
    
    - alert: SuspiciousQueryDetected
      expr: rate(security_suspicious_queries_total[5m]) > 0.05
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Suspicious database query detected"
        description: "Suspicious query rate is {{ $value }} per second"
    
    - alert: ComplianceViolation
      expr: security_compliance_score < 0.8
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Compliance score below threshold"
        description: "Compliance score is {{ $value }}, below required 0.8"
    
    - alert: VulnerabilityDetected
      expr: security_vulnerability_score > 0.7
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "High vulnerability score detected"
        description: "Vulnerability score is {{ $value }}"
    
    - alert: SecurityIncidentCreated
      expr: increase(security_incidents_total[5m]) > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "Security incident created"
        description: "New security incident detected"

---
# Horizontal Pod Autoscaler for Security Framework
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prometheus-security-hpa
  namespace: prometheus-security
  labels:
    app: prometheus-security
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prometheus-security-framework
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60