apiVersion: v1
kind: ConfigMap
metadata:
  name: database-config
  namespace: prometheus-ai
data:
  postgres-host: "postgres-service"
  postgres-port: "5432"
  influxdb-host: "influxdb-service"
  influxdb-port: "8086"
  neo4j-host: "neo4j-service"
  neo4j-port: "7687"
  neo4j-http-port: "7474"
  redis-host: "redis-service"
  redis-port: "6379"
  kafka-host: "kafka-service"
  kafka-port: "9092"
  zookeeper-host: "zookeeper-service"
  zookeeper-port: "2181"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-config
  namespace: prometheus-ai
data:
  api-gateway-port: "3000"
  helios-core-port: "8000"
  data-ingestion-port: "8001"
  volcano-watchtower-port: "8002"
  log-level: "INFO"
  environment: "production"
  consul-host: "consul-service"
  consul-port: "8500"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
  namespace: prometheus-ai
data:
  prometheus-port: "9090"
  grafana-port: "3001"
  metrics-path: "/metrics"
  health-check-interval: "30s"
  scrape-interval: "15s"