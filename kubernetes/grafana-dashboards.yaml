            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
          },
          {
            "id": 6,
            "title": "Model Resource Usage",
            "type": "timeseries",
            "targets": [
              {
                "expr": "model_memory_usage_bytes",
                "legendFormat": "{{model_name}} - Memory"
              },
              {
                "expr": "model_cpu_usage_percent",
                "legendFormat": "{{model_name}} - CPU"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "palette-classic"
