  business-metrics-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Business Metrics Dashboard",
        "tags": ["business", "kpi", "sla"],
        "style": "dark",
        "timezone": "UTC",
        "refresh": "5m",
        "time": {
          "from": "now-24h",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "title": "System Availability (SLA: 99.5%)",
