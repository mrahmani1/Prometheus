  jwt-secret: cHJvbWV0aGV1cy1qd3Qtc2VjcmV0LWtleS0yMDI1  # prometheus-jwt-secret-key-2025
---
apiVersion: v1
kind: Secret
metadata:
  name: api-keys
  namespace: prometheus-ai
type: Opaque
data:
  # Base64 encoded API keys - replace with actual keys in production
  consul-token: Y29uc3VsLXRva2VuLTEyMw==  # consul-token-123
  prometheus-token: cHJvbWV0aGV1cy10b2tlbi0xMjM=  # prometheus-token-123