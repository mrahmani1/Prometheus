apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: prometheus-ai
type: Opaque
data:
  # Base64 encoded values - replace with actual encoded secrets in production
  postgres-user: cHJvbWV0aGV1cw==  # prometheus
  postgres-password: cHJvbWV0aGV1czEyMw==  # prometheus123
  postgres-db: cHJvbWV0aGV1cw==  # prometheus
  influxdb-admin-user: YWRtaW4=  # admin
  influxdb-admin-password: cHJvbWV0aGV1czEyMw==  # prometheus123
  influxdb-org: cHJvbWV0aGV1cw==  # prometheus
  influxdb-bucket: Z2VvbG9naWNhbA==  # geological
