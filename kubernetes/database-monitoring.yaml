apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-database-config
  namespace: prometheus-ai
  labels:
    app: prometheus
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      - "/etc/prometheus/rules/*.yml"
    
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093
    
    scrape_configs:
      # PostgreSQL monitoring
      - job_name: 'postgres-exporter'
        static_configs:
          - targets: ['postgres:9187']
        scrape_interval: 30s
        metrics_path: /metrics
        
      # Redis monitoring
      - job_name: 'redis-exporter'
        static_configs:
          - targets: ['redis:9121']
        scrape_interval: 30s
        metrics_path: /metrics
        
      # InfluxDB monitoring
      - job_name: 'influxdb'
        static_configs:
          - targets: ['influxdb:8086']
        scrape_interval: 30s
        metrics_path: /metrics
        
      # Neo4j monitoring
      - job_name: 'neo4j'
        static_configs:
          - targets: ['neo4j:2004']
        scrape_interval: 30s
        metrics_path: /metrics
        
      # Kafka monitoring
      - job_name: 'kafka-exporter'
        static_configs:
          - targets: ['kafka-exporter:9308']
        scrape_interval: 30s
        metrics_path: /metrics
        
      # TimescaleDB monitoring (same as PostgreSQL)
      - job_name: 'timescaledb-exporter'
        static_configs:
          - targets: ['timescaledb:9187']
        scrape_interval: 30s
        metrics_path: /metrics

  database-alerts.yml: |
    groups:
    - name: database.rules
      rules:
      # PostgreSQL alerts
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL instance is down"
          description: "PostgreSQL instance {{ $labels.instance }} has been down for more than 5 minutes."
          
      - alert: PostgreSQLHighConnections
        expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL high connection usage"
          description: "PostgreSQL instance {{ $labels.instance }} is using {{ $value | humanizePercentage }} of available connections."
          
      - alert: PostgreSQLSlowQueries
        expr: rate(pg_stat_database_tup_returned[5m]) / rate(pg_stat_database_tup_fetched[5m]) < 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL slow queries detected"
          description: "PostgreSQL instance {{ $labels.instance }} has slow query performance."
          
      # Redis alerts
      - alert: RedisDown
        expr: redis_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis instance is down"
          description: "Redis instance {{ $labels.instance }} has been down for more than 5 minutes."
          
      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis high memory usage"
          description: "Redis instance {{ $labels.instance }} is using {{ $value | humanizePercentage }} of available memory."
          
      # InfluxDB alerts
      - alert: InfluxDBDown
        expr: influxdb_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "InfluxDB instance is down"
          description: "InfluxDB instance {{ $labels.instance }} has been down for more than 5 minutes."
          
      - alert: InfluxDBHighDiskUsage
        expr: influxdb_database_diskBytes / influxdb_system_diskTotal > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "InfluxDB high disk usage"
          description: "InfluxDB instance {{ $labels.instance }} disk usage is {{ $value | humanizePercentage }}."
          
      # Neo4j alerts
      - alert: Neo4jDown
        expr: neo4j_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Neo4j instance is down"
          description: "Neo4j instance {{ $labels.instance }} has been down for more than 5 minutes."
          
      - alert: Neo4jHighMemoryUsage
        expr: neo4j_memory_used_heap / neo4j_memory_max_heap > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Neo4j high memory usage"
          description: "Neo4j instance {{ $labels.instance }} heap usage is {{ $value | humanizePercentage }}."
          
      # Backup alerts
      - alert: DatabaseBackupFailed
        expr: time() - database_backup_last_success_timestamp > 86400 * 2
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Database backup failed"
          description: "Database backup for {{ $labels.database }} has not succeeded for more than 2 days."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-database-monitoring
  namespace: prometheus-ai
  labels:
    app: prometheus
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
      component: monitoring
  template:
    metadata:
      labels:
        app: prometheus
        component: monitoring
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
      - name: prometheus
        image: prom/prometheus:v2.47.0
        ports:
        - containerPort: 9090
          name: web
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--web.console.libraries=/etc/prometheus/console_libraries'
          - '--web.console.templates=/etc/prometheus/consoles'
          - '--storage.tsdb.retention.time=30d'
          - '--web.enable-lifecycle'
          - '--web.enable-admin-api'
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-storage
          mountPath: /prometheus
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-database-config
      - name: prometheus-storage
        persistentVolumeClaim:
          claimName: database-monitoring-storage
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-database-monitoring
  namespace: prometheus-ai
  labels:
    app: prometheus
    component: monitoring
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: web
  selector:
    app: prometheus
    component: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-database-dashboards
  namespace: prometheus-ai
  labels:
    app: grafana
    component: monitoring
data:
  database-overview.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Database Overview",
        "tags": ["database", "monitoring"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Database Status",
            "type": "stat",
            "targets": [
              {
                "expr": "pg_up",
                "legendFormat": "PostgreSQL"
              },
              {
                "expr": "redis_up",
                "legendFormat": "Redis"
              },
              {
                "expr": "influxdb_up",
                "legendFormat": "InfluxDB"
              },
              {
                "expr": "neo4j_up",
                "legendFormat": "Neo4j"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0},
                    {"color": "green", "value": 1}
                  ]
                }
              }
            }
          },
          {
            "id": 2,
            "title": "PostgreSQL Connections",
            "type": "timeseries",
            "targets": [
              {
                "expr": "pg_stat_database_numbackends",
                "legendFormat": "Active Connections"
              },
              {
                "expr": "pg_settings_max_connections",
                "legendFormat": "Max Connections"
              }
            ]
          },
          {
            "id": 3,
            "title": "Redis Memory Usage",
            "type": "timeseries",
            "targets": [
              {
                "expr": "redis_memory_used_bytes",
                "legendFormat": "Used Memory"
              },
              {
                "expr": "redis_memory_max_bytes",
                "legendFormat": "Max Memory"
              }
            ]
          },
          {
            "id": 4,
            "title": "InfluxDB Query Rate",
            "type": "timeseries",
            "targets": [
              {
                "expr": "rate(influxdb_queryExecutor_queriesActive[5m])",
                "legendFormat": "Query Rate"
              }
            ]
          },
          {
            "id": 5,
            "title": "Neo4j Transaction Rate",
            "type": "timeseries",
            "targets": [
              {
                "expr": "rate(neo4j_transaction_committed_total[5m])",
                "legendFormat": "Committed Transactions"
              },
              {
                "expr": "rate(neo4j_transaction_rollbacks_total[5m])",
                "legendFormat": "Rolled Back Transactions"
              }
            ]
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "30s"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-database-monitoring
  namespace: prometheus-ai
  labels:
    app: grafana
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
      component: monitoring
  template:
    metadata:
      labels:
        app: grafana
        component: monitoring
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
      - name: grafana
        image: grafana/grafana:10.1.0
        ports:
        - containerPort: 3000
          name: web
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: grafana-admin-password
        - name: GF_INSTALL_PLUGINS
          value: "grafana-piechart-panel,grafana-worldmap-panel"
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-dashboards
          mountPath: /etc/grafana/provisioning/dashboards
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: grafana-storage
        emptyDir: {}
      - name: grafana-dashboards
        configMap:
          name: grafana-database-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-database-monitoring
  namespace: prometheus-ai
  labels:
    app: grafana
    component: monitoring
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: web
  selector:
    app: grafana
    component: monitoring