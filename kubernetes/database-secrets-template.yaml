apiVersion: v1
kind: Secret
metadata:
  name: prometheus-database-credentials
  namespace: prometheus-ai
  labels:
    app: prometheus-ai
    component: database
    environment: ${ENVIRONMENT}
type: Opaque
data:
  # PostgreSQL credentials (base64 encoded)
  postgres-username: ${POSTGRES_USERNAME_B64}
  postgres-password: ${POSTGRES_PASSWORD_B64}
  postgres-database: ${POSTGRES_DATABASE_B64}
  
  # InfluxDB credentials
  influxdb-token: ${INFLUXDB_TOKEN_B64}
  influxdb-org: ${INFLUXDB_ORG_B64}
  influxdb-bucket: ${INFLUXDB_BUCKET_B64}
  
  # Neo4j credentials
  neo4j-username: ${NEO4J_USERNAME_B64}
  neo4j-password: ${NEO4J_PASSWORD_B64}
  neo4j-database: ${NEO4J_DATABASE_B64}
  
  # Redis credentials
  redis-password: ${REDIS_PASSWORD_B64}
  
  # TimescaleDB credentials
  timescaledb-username: ${TIMESCALEDB_USERNAME_B64}
  timescaledb-password: ${TIMESCALEDB_PASSWORD_B64}
  timescaledb-database: ${TIMESCALEDB_DATABASE_B64}
  
  # MongoDB credentials
  mongodb-username: ${MONGODB_USERNAME_B64}
  mongodb-password: ${MONGODB_PASSWORD_B64}
  mongodb-database: ${MONGODB_DATABASE_B64}
  
  # Elasticsearch credentials
  elasticsearch-username: ${ELASTICSEARCH_USERNAME_B64}
  elasticsearch-password: ${ELASTICSEARCH_PASSWORD_B64}
  
  # Kafka credentials
  kafka-username: ${KAFKA_USERNAME_B64}
  kafka-password: ${KAFKA_PASSWORD_B64}
  
  # Database encryption key
  db-encryption-key: ${DB_ENCRYPTION_KEY_B64}

---
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-database-ssl-certs
  namespace: prometheus-ai
  labels:
    app: prometheus-ai
    component: database-ssl
    environment: ${ENVIRONMENT}
type: kubernetes.io/tls
data:
  # PostgreSQL SSL certificates
  postgres-ca.crt: ${POSTGRES_CA_CERT_B64}
  postgres-client.crt: ${POSTGRES_CLIENT_CERT_B64}
  postgres-client.key: ${POSTGRES_CLIENT_KEY_B64}
  
  # InfluxDB SSL certificates
  influxdb-ca.crt: ${INFLUXDB_CA_CERT_B64}
  influxdb-client.crt: ${INFLUXDB_CLIENT_CERT_B64}
  influxdb-client.key: ${INFLUXDB_CLIENT_KEY_B64}
  
  # Neo4j SSL certificates
  neo4j-ca.crt: ${NEO4J_CA_CERT_B64}
  neo4j-client.crt: ${NEO4J_CLIENT_CERT_B64}
  neo4j-client.key: ${NEO4J_CLIENT_KEY_B64}
  
  # Redis SSL certificates
  redis-ca.crt: ${REDIS_CA_CERT_B64}
  redis-client.crt: ${REDIS_CLIENT_CERT_B64}
  redis-client.key: ${REDIS_CLIENT_KEY_B64}
  
  # TimescaleDB SSL certificates
  timescaledb-ca.crt: ${TIMESCALEDB_CA_CERT_B64}
  timescaledb-client.crt: ${TIMESCALEDB_CLIENT_CERT_B64}
  timescaledb-client.key: ${TIMESCALEDB_CLIENT_KEY_B64}
  
  # MongoDB SSL certificates
  mongodb-ca.crt: ${MONGODB_CA_CERT_B64}
  mongodb-client.crt: ${MONGODB_CLIENT_CERT_B64}
  mongodb-client.key: ${MONGODB_CLIENT_KEY_B64}
  
  # Elasticsearch SSL certificates
  elasticsearch-ca.crt: ${ELASTICSEARCH_CA_CERT_B64}
  elasticsearch-client.crt: ${ELASTICSEARCH_CLIENT_CERT_B64}
  elasticsearch-client.key: ${ELASTICSEARCH_CLIENT_KEY_B64}
  
  # Kafka SSL certificates
  kafka-ca.crt: ${KAFKA_CA_CERT_B64}
  kafka-client.crt: ${KAFKA_CLIENT_CERT_B64}
  kafka-client.key: ${KAFKA_CLIENT_KEY_B64}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-database-config
  namespace: prometheus-ai
  labels:
    app: prometheus-ai
    component: database-config
    environment: ${ENVIRONMENT}
data:
  environment: ${ENVIRONMENT}
  config-version: "1.0.0"
  
  # Database hosts and ports (non-sensitive configuration)
  postgres-host: ${POSTGRES_HOST}
  postgres-port: "${POSTGRES_PORT}"
  
  influxdb-host: ${INFLUXDB_HOST}
  influxdb-port: "${INFLUXDB_PORT}"
  
  neo4j-host: ${NEO4J_HOST}
  neo4j-port: "${NEO4J_PORT}"
  
  redis-host: ${REDIS_HOST}
  redis-port: "${REDIS_PORT}"
  
  timescaledb-host: ${TIMESCALEDB_HOST}
  timescaledb-port: "${TIMESCALEDB_PORT}"
  
  mongodb-host: ${MONGODB_HOST}
  mongodb-port: "${MONGODB_PORT}"
  
  elasticsearch-host: ${ELASTICSEARCH_HOST}
  elasticsearch-port: "${ELASTICSEARCH_PORT}"
  
  kafka-host: ${KAFKA_HOST}
  kafka-port: "${KAFKA_PORT}"
  
  # SSL configuration
  ssl-enabled: "${SSL_ENABLED}"
  ssl-verify: "${SSL_VERIFY}"
  
  # Pool configuration
  pool-min-connections: "${POOL_MIN_CONNECTIONS}"
  pool-max-connections: "${POOL_MAX_CONNECTIONS}"
  pool-max-overflow: "${POOL_MAX_OVERFLOW}"
  
  # Timeout configuration
  connection-timeout: "${CONNECTION_TIMEOUT}"
  read-timeout: "${READ_TIMEOUT}"
  write-timeout: "${WRITE_TIMEOUT}"
  
  # Service discovery configuration
  consul-enabled: "${CONSUL_ENABLED}"
  consul-host: ${CONSUL_HOST}
  consul-port: "${CONSUL_PORT}"
  
  # Vault configuration
  vault-enabled: "${VAULT_ENABLED}"
  vault-url: ${VAULT_URL}
  vault-path: ${VAULT_PATH}