apiVersion: v1
kind: ResourceQuota
metadata:
  name: database-resource-quota
  namespace: prometheus-ai
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    requests.storage: 2Ti
    limits.cpu: "20"
    limits.memory: 40Gi
    persistentvolumeclaims: "20"
    pods: "50"
    services: "20"
    secrets: "10"
    configmaps: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: database-limit-range
  namespace: prometheus-ai
spec:
  limits:
  - default:
      cpu: "1000m"
      memory: "2Gi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    type: Container
  - max:
      cpu: "4000m"
      memory: "8Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
    type: Container
  - max:
      storage: "1Ti"
    min:
      storage: "1Gi"
    type: PersistentVolumeClaim
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: database-high-priority
value: 1000
globalDefault: false
description: "High priority class for critical database workloads"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: database-medium-priority
value: 500
globalDefault: false
description: "Medium priority class for standard database workloads"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: database-low-priority
value: 100
globalDefault: false
description: "Low priority class for backup and maintenance workloads"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-scaling-config
  namespace: prometheus-ai
  labels:
    app: prometheus-ai
    component: scaling
data:
  scaling-policy.yaml: |
    databases:
      postgres:
        min_replicas: 1
        max_replicas: 3
        cpu_threshold: 70
        memory_threshold: 80
        connection_threshold: 150
        scale_up_cooldown: 60s
        scale_down_cooldown: 300s
      redis:
        min_replicas: 1
        max_replicas: 5
        cpu_threshold: 60
        memory_threshold: 75
        client_threshold: 1000
        scale_up_cooldown: 30s
        scale_down_cooldown: 180s
      influxdb:
        min_replicas: 1
        max_replicas: 3
        cpu_threshold: 75
        memory_threshold: 85
        query_rate_threshold: 100
        scale_up_cooldown: 120s
        scale_down_cooldown: 600s
      neo4j:
        min_replicas: 1
        max_replicas: 2
        cpu_threshold: 80
        memory_threshold: 90
        transaction_threshold: 50
        scale_up_cooldown: 180s
        scale_down_cooldown: 900s
      timescaledb:
        min_replicas: 1
        max_replicas: 3
        cpu_threshold: 70
        memory_threshold: 80
        connection_threshold: 150
        scale_up_cooldown: 60s
        scale_down_cooldown: 300s
        
  resource-limits.yaml: |
    resource_profiles:
      small:
        cpu_request: "100m"
        cpu_limit: "500m"
        memory_request: "256Mi"
        memory_limit: "1Gi"
        storage: "20Gi"
      medium:
        cpu_request: "500m"
        cpu_limit: "2000m"
        memory_request: "1Gi"
        memory_limit: "4Gi"
        storage: "100Gi"
      large:
        cpu_request: "1000m"
        cpu_limit: "4000m"
        memory_request: "2Gi"
        memory_limit: "8Gi"
        storage: "500Gi"
      xlarge:
        cpu_request: "2000m"
        cpu_limit: "8000m"
        memory_request: "4Gi"
        memory_limit: "16Gi"
        storage: "1Ti"