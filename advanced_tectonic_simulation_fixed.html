<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prometheus AI - Advanced Tectonic Reconstruction System (2024 Enhanced) - FIXED</title>
    
    <!-- Load CSS first -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    
    <!-- Load core libraries synchronously in correct order -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.18.2/plotly.min.js"></script>
    
    <!-- Load fix script before other custom scripts -->
    <script src="fix_insar_issues.js"></script>
    
    <!-- Then load the universal fix -->
    <script src="prometheus_universal_fix.js"></script>
    
    <!-- Load other modules after core libraries with defer -->
    <script defer src="webgl_fix_and_minimize.js"></script>
    <script defer src="holocene_volcanoes_fixed.js"></script>
    <script defer src="mantle_tomography.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #0e4b99 100%);
            color: #ffffff;
            overflow: hidden;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        /* Enhanced Panel System with Advanced Minimize Functionality */
        .panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.95);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 1000;
        }
        
        .panel.minimized {
            padding: 10px 15px;
            transform: scale(0.85);
            opacity: 0.9;
        }
        
        .panel.minimized .panel-content {
            display: none;
        }
        
        .panel.minimized .panel-title {
            font-size: 12px;
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(76, 175, 80, 0.3);
        }
        
        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
            transition: all 0.3s;
        }
        
        .minimize-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .minimize-btn:hover {
            background: rgba(76, 175, 80, 0.3);
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
        }
        
        #ui-panel {
            top: 20px;
            left: 20px;
            width: 380px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
        
        #mantle-analysis-panel {
            top: 20px;
            right: 20px;
            width: 420px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
        
        #quantum-ml-panel {
            bottom: 20px;
            left: 20px;
            width: 450px;
            height: 320px;
        }
        
        #plate-kinematics-panel {
            bottom: 20px;
            right: 20px;
            width: 400px;
            height: 300px;
        }
        
        #map-container, #canvas-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        
        #map-container {
            z-index: 1;
        }
        
        #canvas-container {
            z-index: 2;
            display: none;
        }
        
        #view-toggle {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.95);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            gap: 15px;
            z-index: 1001;
            border: 2px solid rgba(33, 150, 243, 0.3);
        }
        
        #time-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.95);
            border-radius: 20px;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 152, 0, 0.3);
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        
        #info-panel {
            position: absolute;
            bottom: 380px;
            right: 20px;
            background: rgba(0, 0, 0, 0.95);
            border-radius: 15px;
            padding: 20px;
            width: 350px;
            max-height: 350px;
            overflow-y: auto;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(244, 67, 54, 0.3);
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        
        .control-group {
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }
        
        .control-group:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(76, 175, 80, 0.3);
            transform: translateY(-2px);
        }
        
        .control-group h3 {
            margin: 0 0 15px 0;
            color: #4CAF50;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 2px solid rgba(76, 175, 80, 0.3);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .slider-container {
            margin: 15px 0;
        }
        
        .slider-container label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b0b0b0;
            font-weight: 500;
        }
        
        .slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #4CAF50, #2196F3);
            outline: none;
            opacity: 0.8;
            transition: opacity 0.2s;
            -webkit-appearance: none;
        }
        
        .slider:hover {
            opacity: 1;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.4);
            transition: all 0.3s;
        }
        
        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.6);
        }
        
        .value-display {
            display: inline-block;
            background: rgba(76, 175, 80, 0.2);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 10px;
            font-weight: 600;
            color: #4CAF50;
        }
        
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            margin: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.secondary {
            background: linear-gradient(135deg, #2196F3, #1976D2);
        }
        
        button.secondary:hover {
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
        }
        
        button.warning {
            background: linear-gradient(135deg, #FF9800, #F57C00);
        }
        
        button.warning:hover {
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4);
        }
        
        button.danger {
            background: linear-gradient(135deg, #f44336, #d32f2f);
        }
        
        button.danger:hover {
            box-shadow: 0 6px 20px rgba(244, 67, 54, 0.4);
        }
        
        .view-toggle-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .view-toggle-btn.active {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            border-color: #2196F3;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.5);
        }
        
        select {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        select:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(76, 175, 80, 0.5);
        }
        
        select option {
            background: #1a1a2e;
            color: white;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-label {
            color: #888;
            font-size: 14px;
        }
        
        .stat-value {
            color: #4CAF50;
            font-weight: 600;
            font-size: 14px;
        }

        /* Loading and Status Indicators */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s;
        }
        
        .loader {
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loader"></div>
    </div>

    <div id="container">
        <!-- Main Map and 3D Containers -->
        <div id="map-container"></div>
        <div id="canvas-container"></div>
        
        <!-- View Toggle Controls -->
        <div id="view-toggle">
            <button class="view-toggle-btn active" id="btn-2d" onclick="switchView('2d')">🗺️ 2D Map View</button>
            <button class="view-toggle-btn" id="btn-3d" onclick="switchView('3d')">🌍 3D Globe View</button>
            <button class="view-toggle-btn" id="btn-mantle" onclick="switchView('mantle')">🔥 Mantle View</button>
        </div>
        
        <!-- Main Control Panel -->
        <div id="ui-panel" class="panel">
            <div class="panel-header">
                <div class="panel-title">🌍 Tectonic Reconstruction Control Center</div>
                <button class="minimize-btn" onclick="togglePanel('ui-panel')">−</button>
            </div>
            <div class="panel-content">
                <!-- Enhanced Visualization Mode -->
                <div class="control-group">
                    <h3>📊 Visualization Mode</h3>
                    <select id="vis-mode" onchange="updateVisualization()">
                        <option value="plates">Tectonic Plates & Boundaries</option>
                        <option value="earthquakes">Seismic Activity (Real-time)</option>
                        <option value="volcanoes">Holocene Volcanic Activity</option>
                        <option value="hotspots">Hotspot Tracks & Plumes</option>
                        <option value="elevation">Digital Elevation Model</option>
                        <option value="satellite">Satellite Imagery</option>
                        <option value="stress">Lithospheric Stress Field</option>
                        <option value="mantle">Mantle Tomography</option>
                        <option value="geoid">Geoid Anomalies</option>
                    </select>
                </div>
                
                <!-- Time Evolution Controls -->
                <div class="control-group">
                    <h3>⏰ Time Evolution & Reconstruction</h3>
                    <div class="slider-container">
                        <label>Reconstruction Age (Ma): <span class="value-display" id="time-display">0</span></label>
                        <input type="range" class="slider" id="time-slider" 
                               min="0" max="250" value="0" step="0.5"
                               oninput="updateTime(this.value)">
                    </div>
                    <div class="slider-container">
                        <label>Animation Speed: <span class="value-display" id="speed-display">1x</span></label>
                        <input type="range" class="slider" id="speed-slider" 
                               min="0.1" max="10" value="1" step="0.1"
                               oninput="updateSpeed(this.value)">
                    </div>
                </div>
                
                <!-- Advanced Analysis Tools -->
                <div class="control-group">
                    <h3>🔬 Advanced Analysis & ML Tools</h3>
                    <button onclick="runQuantumStressAnalysis()" class="secondary">⚛️ Quantum Stress Analysis</button>
                    <button onclick="runMLPlateKinematics()" class="warning">🤖 ML Plate Kinematics</button>
                    <button onclick="runDeepSeismicRisk()" class="danger">🧠 Deep Learning Risk Assessment</button>
                </div>
            </div>
        </div>
        
        <!-- Info Panel -->
        <div id="info-panel" class="panel">
            <div class="panel-header">
                <div class="panel-title">📊 Real-time Geological Data</div>
                <button class="minimize-btn" onclick="togglePanel('info-panel')">−</button>
            </div>
            <div class="panel-content">
                <div class="stat-item">
                    <span class="stat-label">Current Time:</span>
                    <span class="stat-value" id="current-time">0 Ma</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Active Tectonic Plates:</span>
                    <span class="stat-value" id="active-plates">52</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Global Convergence Rate:</span>
                    <span class="stat-value" id="convergence-rate">65 mm/yr</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">WebGL Status:</span>
                    <span class="stat-value" id="webgl-status">Loading...</span>
                </div>
            </div>
        </div>
        
        <!-- Time Controls -->
        <div id="time-controls">
            <button onclick="playAnimation()" class="secondary">▶ Play Animation</button>
            <button onclick="pauseAnimation()" class="warning">⏸ Pause</button>
            <button onclick="resetAnimation()" class="danger">⏮ Reset to Present</button>
            <input type="number" id="time-input" value="0" min="0" max="250" step="0.5" 
                   style="width: 80px; padding: 8px; background: rgba(255,255,255,0.1); 
                          color: white; border: 1px solid rgba(255,255,255,0.2); 
                          border-radius: 4px;"
                   onchange="jumpToTime(this.value)">
            <span style="margin-left: 10px; color: #4CAF50; font-weight: bold;">Ma</span>
        </div>
    </div>

    <script>
        // Wait for all libraries to load before initializing
        window.addEventListener('load', function() {
            // Hide loading screen
            setTimeout(() => {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => loadingScreen.style.display = 'none', 500);
                }
            }, 1000);
            
            // Initialize the application
            initializeApplication();
        });
        
        // Global variables
        let map, renderer, scene, camera, gl;
        let currentTime = 0, animationSpeed = 1;
        let currentView = '2d';
        let isPlaying = false;
        
        // Initialize application
        function initializeApplication() {
            console.log('Initializing Advanced Tectonic Reconstruction System...');
            
            // Initialize map
            if (typeof L !== 'undefined') {
                try {
                    map = L.map('map-container').setView([20, 0], 2);
                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                        attribution: '© Esri, DigitalGlobe, GeoEye'
                    }).addTo(map);
                    console.log('✅ Map initialized');
                } catch (e) {
                    console.error('Map initialization failed:', e);
                }
            }
            
            // Initialize THREE.js
            if (typeof THREE !== 'undefined') {
                try {
                    const container = document.getElementById('canvas-container');
                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setClearColor(0x000510, 1);
                    container.appendChild(renderer.domElement);
                    
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
                    camera.position.set(0, 0, 300);
                    
                    // Create Earth
                    const earthGeometry = new THREE.SphereGeometry(100, 64, 64);
                    const earthMaterial = new THREE.MeshPhongMaterial({ color: 0x4444ff });
                    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
                    scene.add(earth);
                    
                    // Add lighting
                    const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
                    scene.add(ambientLight);
                    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
                    directionalLight.position.set(100, 100, 50);
                    scene.add(directionalLight);
                    
                    // Add controls if available
                    if (typeof THREE.OrbitControls !== 'undefined') {
                        const controls = new THREE.OrbitControls(camera, renderer.domElement);
                        controls.enableDamping = true;
                        controls.dampingFactor = 0.05;
                    }
                    
                    console.log('✅ THREE.js initialized');
                    document.getElementById('webgl-status').textContent = 'Active';
                } catch (e) {
                    console.error('THREE.js initialization failed:', e);
                    document.getElementById('webgl-status').textContent = 'Failed';
                }
            }
        }
        
        // Panel management
        function togglePanel(panelId) {
            const panel = document.getElementById(panelId);
            if (panel) {
                panel.classList.toggle('minimized');
                const btn = panel.querySelector('.minimize-btn');
                btn.textContent = panel.classList.contains('minimized') ? '+' : '−';
            }
        }
        
        // View switching
        function switchView(view) {
            currentView = view;
            
            document.querySelectorAll('.view-toggle-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`btn-${view}`).classList.add('active');
            
            if (view === '2d') {
                document.getElementById('map-container').style.display = 'block';
                document.getElementById('canvas-container').style.display = 'none';
            } else {
                document.getElementById('map-container').style.display = 'none';
                document.getElementById('canvas-container').style.display = 'block';
                if (renderer) animate3D();
            }
        }
        
        // Time controls
        function updateTime(value) {
            currentTime = parseFloat(value);
            document.getElementById('time-display').textContent = currentTime.toFixed(1);
            document.getElementById('time-input').value = currentTime.toFixed(1);
            document.getElementById('current-time').textContent = currentTime.toFixed(1) + ' Ma';
        }
        
        function updateSpeed(value) {
            animationSpeed = parseFloat(value);
            document.getElementById('speed-display').textContent = animationSpeed.toFixed(1) + 'x';
        }
        
        function playAnimation() {
            isPlaying = true;
            animateTimeline();
        }
        
        function pauseAnimation() {
            isPlaying = false;
        }
        
        function resetAnimation() {
            currentTime = 0;
            document.getElementById('time-slider').value = 0;
            updateTime(0);
            isPlaying = false;
        }
        
        function jumpToTime(value) {
            currentTime = parseFloat(value);
            document.getElementById('time-slider').value = currentTime;
            updateTime(currentTime);
        }
        
        function animateTimeline() {
            if (!isPlaying) return;
            
            currentTime += 0.1 * animationSpeed;
            if (currentTime > 250) currentTime = 0;
            
            document.getElementById('time-slider').value = currentTime;
            updateTime(currentTime);
            
            requestAnimationFrame(animateTimeline);
        }
        
        // Analysis functions
        function runQuantumStressAnalysis() {
            console.log('Running quantum stress analysis...');
        }
        
        function runMLPlateKinematics() {
            console.log('Running ML plate kinematics...');
        }
        
        function runDeepSeismicRisk() {
            console.log('Running deep seismic risk assessment...');
        }
        
        function updateVisualization() {
            const mode = document.getElementById('vis-mode').value;
            console.log('Visualization mode:', mode);
        }
        
        // 3D animation
        function animate3D() {
            if (currentView === '2d') return;
            requestAnimationFrame(animate3D);
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
        
        // Window resize handler
        window.addEventListener('resize', function() {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
            if (map) {
                map.invalidateSize();
            }
        });
        
        console.log('🚀 Advanced Tectonic Reconstruction System Loaded with Fixed Dependencies');
    </script>
</body>
</html>
