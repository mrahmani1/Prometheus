# QA System Configuration for Prometheus AI Platform

# Global QA Settings
global:
  project_name: "Prometheus AI Platform"
  version: "1.0.0"
  environment: "development"  # development, staging, production
  
# Quality Gates Configuration
quality_gates:
  development:
    min_overall_score: 6.0
    max_critical_failures: 2
    min_test_success_rate: 0.85
    min_model_accuracy: 0.75
    min_code_quality: 6.0
    min_documentation_coverage: 0.75
    max_security_high_severity: 2
  
  staging:
    min_overall_score: 7.5
    max_critical_failures: 1
    min_test_success_rate: 0.90
    min_model_accuracy: 0.80
    min_code_quality: 7.0
    min_documentation_coverage: 0.85
    max_security_high_severity: 1
  
  production:
    min_overall_score: 8.5
    max_critical_failures: 0
    min_test_success_rate: 0.95
    min_model_accuracy: 0.85
    min_code_quality: 8.0
    min_documentation_coverage: 0.90
    max_security_high_severity: 0

# QA Components Configuration
components:
  automated_tests:
    enabled: true
    weight: 0.4
    critical: true
    timeout: 1800
    parallel_execution: true
    smart_selection: true
    coverage_threshold: 0.80
    
    test_types:
      unit:
        enabled: true
        timeout: 300
        parallel: true
      integration:
        enabled: true
        timeout: 600
        parallel: false
      performance:
        enabled: true
        timeout: 900
        parallel: false
      e2e:
        enabled: false  # Disabled in development
        timeout: 1200
        parallel: false
  
  model_validation:
    enabled: true
    weight: 0.3
    critical: true
    timeout: 3600
    
    benchmarks:
      yellowstone_seismic:
        enabled: true
        accuracy_threshold: 0.85
        physics_constraints: ["elastic_wave_equation", "velocity_bounds"]
      kilauea_deformation:
        enabled: true
        accuracy_threshold: 0.80
        physics_constraints: ["elastic_deformation", "mass_conservation"]
      san_andreas_stress:
        enabled: true
        accuracy_threshold: 0.75
        physics_constraints: ["stress_equilibrium", "friction_law"]
      iceland_mantle_plume:
        enabled: true
        accuracy_threshold: 0.70
        physics_constraints: ["navier_stokes", "heat_transfer", "buoyancy"]
      cascadia_earthquake:
        enabled: true
        accuracy_threshold: 0.78
        physics_constraints: ["gutenberg_richter", "omori_law"]
  
  code_quality:
    enabled: true
    weight: 0.2
    critical: false
    timeout: 600
    
    tools:
      pylint:
        enabled: true
        config: ".pylintrc"
        max_line_length: 120
        disable_rules: ["C0114", "C0115", "C0116"]
      flake8:
        enabled: true
        max_line_length: 120
        ignore: ["E203", "W503"]
      eslint:
        enabled: true
        config: ".eslintrc.json"
      bandit:
        enabled: true
        severity_threshold: "medium"
    
    complexity:
      max_cyclomatic_complexity: 10
      max_function_length: 50
      max_class_length: 500
  
  documentation:
    enabled: true
    weight: 0.1
    critical: false
    timeout: 900
    
    requirements:
      min_coverage: 0.85
      api_completeness: 0.90
      required_sections: ["overview", "api", "installation", "usage"]
    
    generation:
      api_docs: true
      service_docs: true
      openapi_spec: true
      auto_update: true

# Service-Specific Configurations
services:
  helios-core:
    model_validation:
      min_accuracy: 0.85
      physics_compliance: 0.80
      benchmark_weight: 1.5
    test_coverage:
      min_coverage: 0.85
    complexity:
      max_cyclomatic_complexity: 12  # Higher for AI models
  
  volcano-watchtower:
    performance_requirements:
      max_latency: 100  # milliseconds
      min_throughput: 1000  # requests per second
    real_time_validation: true
    
  api-gateway:
    security_focus: true
    rate_limiting_tests: true
    load_testing: true
    
  data-ingestion:
    data_quality_validation: true
    throughput_testing: true
    error_handling_validation: true

# Notification Configuration
notifications:
  slack:
    enabled: true
    webhook_url: "${SLACK_WEBHOOK_URL}"
    channels:
      qa_alerts: "#qa-alerts"
      model_validation: "#ai-models"
      security_alerts: "#security"
    
  email:
    enabled: true
    smtp_server: "${SMTP_SERVER}"
    recipients:
      qa_team: ["qa-team@prometheus-ai.com"]
      dev_team: ["dev-team@prometheus-ai.com"]
      security_team: ["security@prometheus-ai.com"]
  
  webhook:
    enabled: false
    endpoints:
      - url: "${QA_WEBHOOK_URL}"
        events: ["failure", "critical"]

# Reporting Configuration
reporting:
  formats: ["json", "html", "pdf"]
  retention_days: 90
  
  dashboards:
    enabled: true
    update_interval: 300  # seconds
    metrics:
      - overall_score
      - component_scores
      - trend_analysis
      - failure_rates
      - performance_metrics
  
  exports:
    s3_bucket: "${QA_REPORTS_BUCKET}"
    daily_reports: true
    weekly_summaries: true
    monthly_analytics: true

# Performance Configuration
performance:
  parallel_execution:
    max_workers: 4
    component_parallelism: true
    test_parallelism: true
  
  caching:
    enabled: true
    cache_duration: 3600  # seconds
    cache_backend: "redis"
    cache_key_prefix: "qa_cache"
  
  resource_limits:
    max_memory_mb: 4096
    max_cpu_percent: 80
    max_execution_time: 7200  # seconds

# Integration Configuration
integrations:
  git:
    enabled: true
    hooks:
      pre_commit: true
      pre_push: true
      post_merge: true
    
  ci_cd:
    jenkins:
      enabled: false
    github_actions:
      enabled: true
    gitlab_ci:
      enabled: false
  
  monitoring:
    prometheus:
      enabled: true
      metrics_port: 9090
    grafana:
      enabled: true
      dashboard_id: "qa-dashboard"
  
  databases:
    results_storage:
      type: "postgresql"
      host: "${DB_HOST}"
      database: "qa_results"
      retention_days: 365

# Security Configuration
security:
  vulnerability_scanning:
    enabled: true
    tools: ["bandit", "safety", "npm-audit"]
    severity_threshold: "medium"
  
  secrets_scanning:
    enabled: true
    patterns:
      - "password"
      - "api_key"
      - "secret"
      - "token"
  
  compliance:
    standards: ["OWASP", "CWE"]
    reporting: true

# Experimental Features
experimental:
  ai_powered_test_generation:
    enabled: false
    confidence_threshold: 0.8
  
  predictive_quality_analysis:
    enabled: false
    model_path: "models/quality_predictor.pkl"
  
  automated_fix_suggestions:
    enabled: false
    suggestion_confidence: 0.9