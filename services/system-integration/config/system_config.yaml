# Comprehensive System Configuration for Prometheus AI Platform
# This file defines system-wide configuration for complex deployments

# Cloud Resources Configuration
cloud_resources:
  tpu_pods:
    enabled: true
    max_pods: 8
    auto_scaling: true
    cost_optimization: true
    regions:
      - us-central1
      - europe-west4
      - asia-southeast1
    resource_quotas:
      v4_tpus: 32
      v5_tpus: 16
  
  gpu_clusters:
    enabled: true
    max_nodes: 20
    gpu_types:
      - V100
      - A100
      - H100
    auto_scaling: true
    spot_instances: true
    regions:
      - us-west1
      - us-east1
      - europe-west1
    resource_quotas:
      v100_gpus: 64
      a100_gpus: 32
      h100_gpus: 16
  
  serverless:
    enabled: true
    max_instances: 200
    timeout: 900
    memory: 8Gi
    cpu: 4
    auto_scaling: true
    cold_start_optimization: true
    regions:
      - global

# Database Configuration
databases:
  connection_pooling: true
  max_connections: 150
  timeout: 45
  retry_attempts: 5
  health_check_interval: 30
  
  timescale:
    host: timescale-db
    port: 5432
    database: prometheus_timeseries
    pool_size: 25
    max_overflow: 10
    compression: true
    continuous_aggregates: true
    retention_policies:
      raw_data: 90d
      hourly_aggregates: 2y
      daily_aggregates: 10y
  
  postgres:
    host: postgres
    port: 5432
    database: prometheus_spatial
    pool_size: 20
    max_overflow: 8
    extensions:
      - postgis
      - timescaledb
    spatial_indexing: true
    materialized_views: true
    partitioning: true
  
  neo4j:
    host: neo4j
    port: 7687
    database: prometheus_graph
    pool_size: 15
    max_overflow: 5
    graph_algorithms: true
    apoc_procedures: true
    graph_data_science: true
    memory_settings:
      heap_initial_size: 2G
      heap_max_size: 8G
      page_cache_size: 4G
  
  mongodb:
    host: mongodb
    port: 27017
    database: prometheus_documents
    pool_size: 20
    max_overflow: 8
    sharding: true
    indexing_strategy: compound
    aggregation_pipeline: true
    compression: snappy
  
  redis:
    host: redis
    port: 6379
    pool_size: 30
    max_overflow: 10
    clustering: true
    persistence: true
    memory_policy: allkeys-lru

# Integration Pipelines Configuration
integration_pipelines:
  max_concurrent_flows: 100
  timeout: 7200
  retry_attempts: 5
  monitoring_enabled: true
  
  autonomous_discovery:
    enabled: true
    data_sources:
      - data-ingestion
      - volcano-watchtower
      - timescale-db
      - graph-database
    processing_services:
      - helios-core
      - knowledge-graph
      - anomaly-detection
    target_services:
      - vulcan-ui
      - system-monitor
    processing_stages:
      - data_collection
      - quality_validation
      - causal_inference
      - hypothesis_generation
      - anomaly_detection
      - visualization_preparation
    real_time: true
    batch_processing: true
    cloud_resources: true
  
  geological_modeling:
    enabled: true
    data_sources:
      - data-ingestion
      - knowledge-graph
      - graph-database
    processing_services:
      - helios-core
      - cloud-run-config
    target_services:
      - vulcan-ui
      - timescale-db
    processing_stages:
      - model_initialization
      - physics_constraint_application
      - pinn_training
      - simulation_execution
      - uncertainty_quantification
      - result_validation
    cloud_resources:
      tpu_pods: true
      gpu_clusters: true
      high_memory_instances: true
  
  real_time_monitoring:
    enabled: true
    data_sources:
      - data-ingestion
      - edge-device-manager
    processing_services:
      - volcano-watchtower
      - helios-core
      - anomaly-detection
    target_services:
      - vulcan-ui
      - system-monitor
    processing_stages:
      - stream_ingestion
      - real_time_fusion
      - event_detection
      - risk_assessment
      - alert_generation
      - visualization_update
    latency_requirements:
      ingestion: 1  # seconds
      processing: 5  # seconds
      visualization: 10  # seconds
    streaming: true

# Monitoring Configuration
monitoring:
  metrics_collection: true
  alerting_enabled: true
  log_level: INFO
  performance_tracking: true
  
  health_checks:
    interval: 30  # seconds
    timeout: 10  # seconds
    retries: 3
    
  performance_thresholds:
    cpu_utilization: 80.0  # percent
    memory_utilization: 85.0  # percent
    response_time: 5.0  # seconds
    error_rate: 0.05  # 5%
    throughput_min: 100  # requests/minute
  
  alerting:
    channels:
      - email
      - slack
      - webhook
    escalation_rules:
      - level: warning
        threshold_multiplier: 1.0
        notification_delay: 300  # 5 minutes
      - level: critical
        threshold_multiplier: 1.2
        notification_delay: 60  # 1 minute
      - level: emergency
        threshold_multiplier: 1.5
        notification_delay: 0  # immediate

# Advanced Features Configuration
advanced_features:
  magmatic_intrusion_analysis:
    enabled: true
    advanced_features:
      magma_composition_analysis: true
      viscosity_modeling: true
      gas_content_analysis: true
      intrusion_geometry_detection: true
      temporal_evolution_tracking: true
    cloud_resources:
      gpu_allocation: true
      high_memory_instances: true
      parallel_processing: true
    model_training:
      physics_constraints: true
      uncertainty_quantification: true
      ensemble_methods: true
  
  asf_insar_integration:
    enabled: true
    api_endpoints:
      search: https://api.daac.asf.alaska.edu/services/search/param
      download: https://api.daac.asf.alaska.edu/services/utils/download
      metadata: https://api.daac.asf.alaska.edu/services/utils/metadata
    processing_options:
      atmospheric_correction: true
      phase_unwrapping: true
      deformation_calculation: true
      uncertainty_estimation: true
      time_series_analysis: true
    integration_points:
      geological_model_training: true
      volcano_watchtower: true
      vulcan_ui: true
      real_time_processing: true
    data_types:
      - SAR
      - InSAR
      - deformation_maps
      - coherence_maps
      - time_series
    update_frequency: daily
    quality_control:
      coherence_threshold: 0.3
      unwrapping_quality_check: true
      atmospheric_correction_validation: true
      temporal_consistency_check: true

# Security Configuration
security:
  authentication:
    enabled: true
    method: jwt
    token_expiry: 3600  # 1 hour
    refresh_token_expiry: 86400  # 24 hours
  
  authorization:
    enabled: true
    rbac: true
    permissions:
      - read
      - write
      - execute
      - admin
  
  encryption:
    data_at_rest: true
    data_in_transit: true
    key_rotation: true
    key_rotation_interval: 2592000  # 30 days
  
  network_security:
    firewall_enabled: true
    intrusion_detection: true
    ddos_protection: true
    rate_limiting: true

# Cost Optimization Configuration
cost_optimization:
  enabled: true
  strategies:
    spot_instances: true
    preemptible_resources: true
    auto_scaling: true
    resource_scheduling: true
    idle_resource_detection: true
  
  budgets:
    monthly_limit: 50000  # USD
    alert_thresholds:
      - 50  # percent
      - 75  # percent
      - 90  # percent
  
  optimization_schedule:
    daily_optimization: true
    weekly_deep_analysis: true
    monthly_cost_review: true

# Disaster Recovery Configuration
disaster_recovery:
  enabled: true
  backup_frequency: daily
  backup_retention: 90  # days
  cross_region_replication: true
  
  recovery_objectives:
    rto: 4  # hours (Recovery Time Objective)
    rpo: 1  # hour (Recovery Point Objective)
  
  failover:
    automatic: true
    health_check_failures: 3
    failover_timeout: 300  # seconds

# Development and Testing Configuration
development:
  debug_mode: false
  test_data_generation: true
  mock_external_services: false
  
  testing:
    unit_tests: true
    integration_tests: true
    performance_tests: true
    security_tests: true
    
  ci_cd:
    automated_testing: true
    automated_deployment: true
    rollback_on_failure: true
    blue_green_deployment: true