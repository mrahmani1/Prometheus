# Cloud Run Deployment Configuration
# Multi-region deployment with auto-scaling and cost optimization

apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-run-config
  namespace: prometheus-ai
data:
  # Global Cloud Run settings
  project_id: "prometheus-ai-platform"
  regions: "us-central1,europe-west1,asia-northeast1"
  
  # Scaling configuration
  min_instances: "0"
  max_instances: "100"
  concurrency: "80"
  cpu_throttling: "true"
  
  # Cost optimization
  use_preemptible: "true"
  preemptible_percentage: "0.7"
  scale_to_zero_timeout: "300"
  
  # Performance settings
  execution_environment: "gen2"
  cpu_boost: "false"
  startup_cpu_boost: "true"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloud-run-optimizer
  namespace: prometheus-ai
spec:
  schedule: "*/5 * * * *"  # Run every 5 minutes
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: cloud-run-optimizer
          containers:
          - name: optimizer
            image: gcr.io/prometheus-ai-platform/cloud-run-optimizer:latest
            env:
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                configMapKeyRef:
                  name: cloud-run-config
                  key: project_id
            - name: REGIONS
              valueFrom:
                configMapKeyRef:
                  name: cloud-run-config
                  key: regions
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
          restartPolicy: OnFailure

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-run-optimizer
  namespace: prometheus-ai
  annotations:
    iam.gke.io/gcp-service-account: cloud-run-optimizer@prometheus-ai-platform.iam.gserviceaccount.com

---
# Cloud Run Service Template for Helios Core
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: helios-core
  namespace: prometheus-ai
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
spec:
  template:
    metadata:
      annotations:
        # Auto-scaling configuration
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "50"
        autoscaling.knative.dev/target: "70"
        
        # Resource configuration
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: "gen2"
        run.googleapis.com/startup-cpu-boost: "true"
        
        # Cost optimization
        run.googleapis.com/pricing-tier: "standard"
        
        # Networking
        run.googleapis.com/vpc-access-connector: "prometheus-connector"
        run.googleapis.com/vpc-access-egress: "private-ranges-only"
    spec:
      containerConcurrency: 10
      timeoutSeconds: 300
      serviceAccountName: helios-core-sa
      containers:
      - image: gcr.io/prometheus-ai-platform/helios-core:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          limits:
            cpu: "4000m"
            memory: "8Gi"
          requests:
            cpu: "1000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5

---
# Cloud Run Service Template for API Gateway
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api-gateway
  namespace: prometheus-ai
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "100"
        autoscaling.knative.dev/target: "80"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: "gen2"
    spec:
      containerConcurrency: 1000
      timeoutSeconds: 60
      containers:
      - image: gcr.io/prometheus-ai-platform/api-gateway:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: NODE_ENV
          value: "production"
        resources:
          limits:
            cpu: "2000m"
            memory: "4Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"

---
# Cloud Run Service Template for Data Ingestion
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: data-ingestion
  namespace: prometheus-ai
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "20"
        autoscaling.knative.dev/target: "60"
        run.googleapis.com/execution-environment: "gen2"
    spec:
      containerConcurrency: 100
      timeoutSeconds: 600
      containers:
      - image: gcr.io/prometheus-ai-platform/data-ingestion:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "2000m"
            memory: "4Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"

---
# Cloud Run Service Template for Volcano Watchtower
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: volcano-watchtower
  namespace: prometheus-ai
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "30"
        autoscaling.knative.dev/target: "50"
        run.googleapis.com/execution-environment: "gen2"
    spec:
      containerConcurrency: 50
      timeoutSeconds: 180
      containers:
      - image: gcr.io/prometheus-ai-platform/volcano-watchtower:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "3000m"
            memory: "6Gi"
          requests:
            cpu: "1000m"
            memory: "2Gi"