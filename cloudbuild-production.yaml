steps:
  # Pre-deployment Security and Quality Checks
  - name: 'sonarqube/sonar-scanner-cli:latest'
    id: 'production-sonar-analysis'
    env:
      - 'SONAR_TOKEN=${_SONAR_TOKEN}'
      - 'SONAR_HOST_URL=${_SONAR_HOST_URL}'
    args:
      - '-Dsonar.projectKey=${_SONAR_PROJECT_KEY}'
      - '-Dsonar.sources=.'
      - '-Dsonar.qualitygate.wait=true'
      - '-Dsonar.branch.name=main'

  - name: 'aquasec/trivy:latest'
    id: 'production-security-scan'
    args:
      - 'fs'
      - '--security-checks'
      - 'vuln,secret,config'
      - '--severity'
      - 'HIGH,CRITICAL'
      - '--exit-code'
      - '1'
      - '.'

  # Build Production Images with Security Scanning
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-production-helios-core'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/helios-core:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/helios-core:production-latest'
      - '--target'
      - 'production'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/helios-core:production-latest'
      - './services/helios-core'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-production-data-ingestion'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/data-ingestion:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/data-ingestion:production-latest'
      - '--target'
      - 'production'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/data-ingestion:production-latest'
      - './services/data-ingestion'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-production-volcano-watchtower'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/volcano-watchtower:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/volcano-watchtower:production-latest'
      - '--target'
      - 'production'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/volcano-watchtower:production-latest'
      - './services/volcano-watchtower'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-production-api-gateway'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/api-gateway:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/api-gateway:production-latest'
      - '--target'
      - 'production'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/api-gateway:production-latest'
      - './services/api-gateway'

  # Container Security Scanning
  - name: 'aquasec/trivy:latest'
    id: 'scan-production-helios-core'
    args:
      - 'image'
      - '--severity'
      - 'HIGH,CRITICAL'
      - '--exit-code'
      - '1'
      - 'gcr.io/$PROJECT_ID/helios-core:$COMMIT_SHA'

  - name: 'aquasec/trivy:latest'
    id: 'scan-production-data-ingestion'
    args:
      - 'image'
      - '--severity'
      - 'HIGH,CRITICAL'
      - '--exit-code'
      - '1'
      - 'gcr.io/$PROJECT_ID/data-ingestion:$COMMIT_SHA'

  - name: 'aquasec/trivy:latest'
    id: 'scan-production-volcano-watchtower'
    args:
      - 'image'
      - '--severity'
      - 'HIGH,CRITICAL'
      - '--exit-code'
      - '1'
      - 'gcr.io/$PROJECT_ID/volcano-watchtower:$COMMIT_SHA'

  - name: 'aquasec/trivy:latest'
    id: 'scan-production-api-gateway'
    args:
      - 'image'
      - '--severity'
      - 'HIGH,CRITICAL'
      - '--exit-code'
      - '1'
      - 'gcr.io/$PROJECT_ID/api-gateway:$COMMIT_SHA'

  # Push Production Images
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-production-images'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/helios-core'
    waitFor: ['build-production-helios-core', 'scan-production-helios-core']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/data-ingestion'
    waitFor: ['build-production-data-ingestion', 'scan-production-data-ingestion']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/volcano-watchtower'
    waitFor: ['build-production-volcano-watchtower', 'scan-production-volcano-watchtower']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/api-gateway'
    waitFor: ['build-production-api-gateway', 'scan-production-api-gateway']

  # Infrastructure Validation
  - name: 'hashicorp/terraform:1.6'
    id: 'terraform-validate'
    dir: 'terraform'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        terraform init
        terraform validate
        terraform plan -var="environment=production" -out=production.tfplan

  # Pre-deployment Backup
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'pre-deployment-backup'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=prometheus-production'
    args:
      - 'create'
      - 'job'
      - 'pre-deployment-backup-$BUILD_ID'
      - '--from=cronjob/prometheus-backup'
      - '--namespace=prometheus-production'

  # Wait for Manual Approval (if required)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deployment-approval'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_APPROVAL_REQUIRED}" = "true" ]; then
          echo "Manual approval required for production deployment"
          echo "Deployment will proceed automatically after approval"
          # In a real scenario, this would integrate with an approval system
          sleep 30
        fi

  # Blue-Green Deployment
  - name: 'bash'
    id: 'blue-green-deployment'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_DEPLOYMENT_STRATEGY}" = "blue-green" ]; then
          ./scripts/blue-green-deploy.sh production $COMMIT_SHA
        else
          echo "Skipping blue-green deployment"
        fi
    waitFor: ['push-production-images', 'terraform-validate', 'pre-deployment-backup', 'deployment-approval']

  # Canary Deployment (Alternative)
  - name: 'bash'
    id: 'canary-deployment'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_DEPLOYMENT_STRATEGY}" = "canary" ]; then
          ./scripts/canary-deploy.sh production $COMMIT_SHA
        else
          echo "Skipping canary deployment"
        fi
    waitFor: ['push-production-images', 'terraform-validate', 'pre-deployment-backup', 'deployment-approval']

  # Multi-Cloud Deployment
  - name: 'bash'
    id: 'multi-cloud-deployment'
    entrypoint: 'bash'
    args:
      - './scripts/multi-cloud-setup.sh'
    env:
      - 'GCP_PROJECT_ID=$PROJECT_ID'
      - 'AZURE_SUBSCRIPTION_ID=${_AZURE_SUBSCRIPTION_ID}'
      - 'AWS_REGION=${_AWS_REGION}'
    waitFor: ['blue-green-deployment', 'canary-deployment']

  # Post-deployment Validation
  - name: 'bash'
    id: 'deployment-validation'
    entrypoint: 'bash'
    args:
      - './scripts/deployment-validation.sh'
      - 'production'
    waitFor: ['multi-cloud-deployment']

  # Health Checks
  - name: 'bash'
    id: 'health-checks'
    entrypoint: 'bash'
    args:
      - './scripts/health-checks.sh'
      - 'production'
    waitFor: ['deployment-validation']

  # Smoke Tests
  - name: 'bash'
    id: 'production-smoke-tests'
    entrypoint: 'bash'
    args:
      - './scripts/smoke-tests.sh'
      - 'production'
    waitFor: ['health-checks']

  # Performance Tests
  - name: 'loadimpact/k6:latest'
    id: 'performance-tests'
    entrypoint: 'k6'
    args:
      - 'run'
      - '--vus'
      - '100'
      - '--duration'
      - '5m'
      - 'tests/performance/load-test.js'
    env:
      - 'K6_PROMETHEUS_REMOTE_URL=${_PROMETHEUS_URL}'
    waitFor: ['production-smoke-tests']

  # Security Validation
  - name: 'owasp/zap2docker-stable'
    id: 'security-validation'
    entrypoint: 'zap-baseline.py'
    args:
      - '-t'
      - 'https://prometheus-ai.example.com'
      - '-J'
      - 'zap-report.json'
    waitFor: ['performance-tests']

  # Monitoring Setup
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'setup-monitoring'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=prometheus-production'
    args:
      - 'apply'
      - '-f'
      - 'kubernetes/monitoring.yaml'
      - '--namespace=prometheus-production'
    waitFor: ['security-validation']

  # Notification
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deployment-notification'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"🚀 Production deployment completed successfully for commit $COMMIT_SHA"}' \
          ${_SLACK_WEBHOOK_URL}
    waitFor: ['setup-monitoring']

# Deployment rollback on failure
onFailure:
  - name: 'bash'
    entrypoint: 'bash'
    args:
      - './scripts/rollback-deployment.sh'
      - 'production'

# Secrets and substitutions
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/sonar-token/versions/latest
      env: 'SONAR_TOKEN'
    - versionName: projects/$PROJECT_ID/secrets/slack-webhook/versions/latest
      env: 'SLACK_WEBHOOK_URL'
    - versionName: projects/$PROJECT_ID/secrets/azure-subscription-id/versions/latest
      env: 'AZURE_SUBSCRIPTION_ID'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_32'
  diskSizeGb: 100
  substitutionOption: 'ALLOW_LOOSE'

substitutions:
  _SONAR_TOKEN: ''
  _SONAR_HOST_URL: 'https://sonarcloud.io'
  _SONAR_PROJECT_KEY: 'prometheus-ai-platform'
  _DEPLOYMENT_STRATEGY: 'blue-green'
  _APPROVAL_REQUIRED: 'true'
  _AZURE_SUBSCRIPTION_ID: ''
  _AWS_REGION: 'us-west-2'
  _PROMETHEUS_URL: 'https://prometheus.prometheus-ai.example.com'
  _SLACK_WEBHOOK_URL: ''

timeout: 3600s  # 1 hour timeout for production deployment

images:
  - 'gcr.io/$PROJECT_ID/helios-core:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/data-ingestion:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/volcano-watchtower:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/api-gateway:$COMMIT_SHA'

artifacts:
  objects:
    location: 'gs://$PROJECT_ID-production-artifacts'
    paths:
      - 'zap-report.json'
      - 'terraform/production.tfplan'
      - 'performance-test-results.json'