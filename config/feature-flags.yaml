# Feature Flags Configuration for Prometheus AI Platform

# LaunchDarkly Configuration
launchdarkly:
  sdk_key: "${LAUNCHDARKLY_SDK_KEY}"
  environment: "${ENVIRONMENT}"
  timeout: 5000
  stream: true
  offline: false
  
  # Feature Flag Definitions
  flags:
    # Core AI Features
    enable_physics_informed_neural_networks:
      default: true
      description: "Enable Physics-Informed Neural Networks for geological modeling"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    enable_advanced_gnn_implementations:
      default: true
      description: "Enable advanced Graph Neural Network implementations"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    enable_uncertainty_quantification_gans:
      default: true
      description: "Enable Uncertainty Quantification using GANs"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    # Monitoring Features
    enable_real_time_volcanic_monitoring:
      default: true
      description: "Enable real-time volcanic monitoring capabilities"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    enable_seismic_transformer:
      default: true
      description: "Enable Seismic Transformer for event detection"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    enable_eruption_forecaster_ml:
      default: true
      description: "Enable ML-based eruption forecasting"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    # Data Processing Features
    enable_multi_sensor_fusion:
      default: true
      description: "Enable multi-sensor data fusion capabilities"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    enable_advanced_database_integration:
      default: true
      description: "Enable advanced database integration features"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    enable_stream_processing:
      default: true
      description: "Enable real-time stream processing"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    # Visualization Features
    enable_high_resolution_visualization:
      default: true
      description: "Enable high-resolution 3D/4D visualization"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    enable_digital_twin_visualization:
      default: true
      description: "Enable digital twin visualization capabilities"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    # Performance Features
    enable_gpu_acceleration:
      default: true
      description: "Enable GPU acceleration for ML workloads"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    enable_parallel_computing:
      default: true
      description: "Enable parallel computing optimizations"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    # Security Features
    enable_advanced_security_framework:
      default: true
      description: "Enable advanced security and compliance features"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    enable_zero_trust_architecture:
      default: false
      description: "Enable zero-trust security architecture"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    # Experimental Features
    enable_quantum_computing_integration:
      default: false
      description: "Enable experimental quantum computing integration"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    enable_edge_computing:
      default: false
      description: "Enable edge computing capabilities"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    enable_federated_learning:
      default: false
      description: "Enable federated learning for distributed training"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    # Deployment Features
    enable_blue_green_deployment:
      default: true
      description: "Enable blue-green deployment strategy"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    enable_canary_deployment:
      default: false
      description: "Enable canary deployment strategy"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false
    
    enable_multi_cloud_deployment:
      default: true
      description: "Enable multi-cloud deployment capabilities"
      variations:
        - key: "enabled"
          value: true
        - key: "disabled"
          value: false

# ConfigCat Configuration (Alternative)
configcat:
  sdk_key: "${CONFIGCAT_SDK_KEY}"
  base_url: "https://cdn-global.configcat.com"
  poll_interval: 60
  cache_time: 60
  
# Split.io Configuration (Alternative)
split:
  api_key: "${SPLIT_API_KEY}"
  environment: "${ENVIRONMENT}"
  
# Environment-specific Overrides
environments:
  staging:
    enable_quantum_computing_integration: false
    enable_edge_computing: false
    enable_federated_learning: false
    enable_zero_trust_architecture: false
    enable_canary_deployment: true
    
  production:
    enable_quantum_computing_integration: false
    enable_edge_computing: true
    enable_federated_learning: true
    enable_zero_trust_architecture: true
    enable_canary_deployment: false
    enable_blue_green_deployment: true

# Feature Flag Rules and Targeting
targeting:
  # User-based targeting
  user_attributes:
    - "user_id"
    - "email"
    - "role"
    - "organization"
    - "subscription_tier"
  
  # Geographic targeting
  geographic_attributes:
    - "country"
    - "region"
    - "timezone"
  
  # Technical targeting
  technical_attributes:
    - "browser"
    - "device_type"
    - "app_version"
    - "api_version"

# Rollout Strategies
rollout_strategies:
  gradual_rollout:
    type: "percentage"
    initial_percentage: 5
    increment_percentage: 10
    increment_interval: "24h"
    max_percentage: 100
  
  user_based_rollout:
    type: "user_attribute"
    attribute: "subscription_tier"
    values: ["premium", "enterprise"]
  
  geographic_rollout:
    type: "geographic"
    regions: ["us-west", "us-east", "eu-west"]
    
# Monitoring and Analytics
monitoring:
  enable_flag_analytics: true
  enable_performance_monitoring: true
  enable_error_tracking: true
  
  # Metrics to track
  metrics:
    - "flag_evaluation_count"
    - "flag_evaluation_latency"
    - "flag_error_rate"
    - "feature_usage_rate"
    - "user_engagement_rate"

# Integration Configuration
integrations:
  prometheus:
    enabled: true
    metrics_endpoint: "/metrics"
    
  grafana:
    enabled: true
    dashboard_id: "feature-flags-dashboard"
    
  datadog:
    enabled: false
    api_key: "${DATADOG_API_KEY}"
    
  newrelic:
    enabled: false
    license_key: "${NEWRELIC_LICENSE_KEY}"