# Development Environment Database Configuration Template

postgresql:
  host: "${POSTGRES_HOST:localhost}"
  port: "${POSTGRES_PORT:5432}"
  database: "${POSTGRES_DB:prometheus_dev}"
  ssl_enabled: false
  ssl_verify: false
  timeout: 30
  read_timeout: 60
  write_timeout: 60
  pool_config:
    min_connections: 2
    max_connections: 10
    max_overflow: 20
    pool_timeout: 30
    pool_recycle: 3600
    pool_pre_ping: true
    retry_attempts: 3
    retry_delay: 1.0
    health_check_interval: 300
  tags:
    environment: development
    purpose: primary_database
  metadata:
    description: "Primary PostgreSQL database for development"
    maintainer: "prometheus-dev-team"

influxdb:
  host: "${INFLUXDB_HOST:localhost}"
  port: "${INFLUXDB_PORT:8086}"
  database: "${INFLUXDB_BUCKET:geological_data_dev}"
  ssl_enabled: false
  ssl_verify: false
  timeout: 30
  read_timeout: 60
  write_timeout: 60
  tags:
    environment: development
    purpose: time_series_data
  metadata:
    description: "InfluxDB for time-series geological data in development"
    retention_policy: "30d"
    org: "${INFLUXDB_ORG:prometheus_dev}"

neo4j:
  host: "${NEO4J_HOST:localhost}"
  port: "${NEO4J_PORT:7687}"
  database: "${NEO4J_DATABASE:neo4j}"
  ssl_enabled: false
  ssl_verify: false
  timeout: 30
  read_timeout: 60
  write_timeout: 60
  pool_config:
    min_connections: 2
    max_connections: 10
    max_overflow: 15
    pool_timeout: 30
    pool_recycle: 3600
    pool_pre_ping: true
    retry_attempts: 3
    retry_delay: 1.0
    health_check_interval: 300
  tags:
    environment: development
    purpose: graph_database
  metadata:
    description: "Neo4j graph database for causal relationships in development"

