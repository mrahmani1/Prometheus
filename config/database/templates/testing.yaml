# Testing Environment Database Configuration Template

postgresql:
  host: "${POSTGRES_HOST:localhost}"
  port: "${POSTGRES_PORT:5432}"
  database: "${POSTGRES_DB:prometheus_test}"
  ssl_enabled: false
  ssl_verify: false
  timeout: 15
  read_timeout: 30
  write_timeout: 30
  pool_config:
    min_connections: 1
    max_connections: 5
    max_overflow: 10
    pool_timeout: 15
    pool_recycle: 1800
    pool_pre_ping: true
    retry_attempts: 2
    retry_delay: 0.5
    health_check_interval: 600
  tags:
    environment: testing
    purpose: primary_database
    ephemeral: true
  metadata:
    description: "Primary PostgreSQL database for testing"
    maintainer: "prometheus-test-team"
    auto_cleanup: true

influxdb:
  host: "${INFLUXDB_HOST:localhost}"
  port: "${INFLUXDB_PORT:8086}"
  database: "${INFLUXDB_BUCKET:geological_data_test}"
  ssl_enabled: false
  ssl_verify: false
  timeout: 15
  read_timeout: 30
  write_timeout: 30
  tags:
    environment: testing
    purpose: time_series_data
    ephemeral: true
  metadata:
    description: "InfluxDB for time-series geological data in testing"
    retention_policy: "1d"
    org: "${INFLUXDB_ORG:prometheus_test}"
    auto_cleanup: true

