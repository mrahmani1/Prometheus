# Comprehensive Causal Analysis Stack
# Production-ready Docker Compose configuration for the causal analysis service and dependencies

version: '3.8'

services:
  # Causal Analysis Service
  causal-analysis:
    build:
      context: ./services/causal-analysis
      dockerfile: Dockerfile
    container_name: prometheus-causal-analysis
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"  # Prometheus metrics
    environment:
      # Service configuration
      SERVICE_NAME: causal-analysis
      SERVICE_VERSION: 1.0.0
      HOST: 0.0.0.0
      PORT: 8080
      DEBUG: "false"
      
      # Database configurations
      POSTGRES_HOST: postgres-causal
      POSTGRES_PORT: 5432
      POSTGRES_DB: prometheus_causal
      POSTGRES_USER: prometheus
      POSTGRES_PASSWORD: prometheus123
      
      REDIS_HOST: redis-causal
      REDIS_PORT: 6379
      REDIS_DB: 0
      
      NEO4J_URI: bolt://neo4j-causal:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: prometheus123
      
      INFLUXDB_URL: http://influxdb-causal:8086
      INFLUXDB_TOKEN: prometheus-causal-token
      INFLUXDB_ORG: prometheus
      INFLUXDB_BUCKET: causal-data
      
      # Service discovery
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      
      # Performance settings
      MAX_WORKERS: 4
      MAX_CONNECTIONS: 100
      CACHE_TTL: 3600
      
      # Causal analysis settings
      CAUSAL_CONFIDENCE_THRESHOLD: 0.05
      MAX_GRAPH_SIZE: 10000
      DISCOVERY_TIMEOUT: 300
    depends_on:
      - postgres-causal
      - redis-causal
      - neo4j-causal
      - influxdb-causal
      - consul
    networks:
      - causal-network
    volumes:
      - causal-logs:/app/logs
      - causal-cache:/app/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL with PostGIS for geospatial data
  postgres-causal:
    image: postgis/postgis:15-3.3
    container_name: prometheus-postgres-causal
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: prometheus_causal
      POSTGRES_USER: prometheus
      POSTGRES_PASSWORD: prometheus123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-causal-data:/var/lib/postgresql/data
      - ./database/postgres/init-causal.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/postgres/schema-causal.sql:/docker-entrypoint-initdb.d/02-schema.sql
      - ./database/postgres/indexes-causal.sql:/docker-entrypoint-initdb.d/03-indexes.sql
    networks:
      - causal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prometheus -d prometheus_causal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and session management
  redis-causal:
    image: redis:7.2-alpine
    container_name: prometheus-redis-causal
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-causal-data:/data
    networks:
      - causal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Neo4j for causal graph storage
  neo4j-causal:
    image: neo4j:5.14-community
    container_name: prometheus-neo4j-causal
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/prometheus123
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_default__listen__address: 0.0.0.0
      NEO4J_dbms_connector_bolt_listen__address: 0.0.0.0:7687
      NEO4J_dbms_connector_http_listen__address: 0.0.0.0:7474
    volumes:
      - neo4j-causal-data:/data
      - neo4j-causal-logs:/logs
      - neo4j-causal-import:/var/lib/neo4j/import
      - neo4j-causal-plugins:/plugins
    networks:
      - causal-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "prometheus123", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # InfluxDB for time-series geological data
  influxdb-causal:
    image: influxdb:2.7
    container_name: prometheus-influxdb-causal
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: prometheus
      DOCKER_INFLUXDB_INIT_PASSWORD: prometheus123
      DOCKER_INFLUXDB_INIT_ORG: prometheus
      DOCKER_INFLUXDB_INIT_BUCKET: causal-data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: prometheus-causal-token
    volumes:
      - influxdb-causal-data:/var/lib/influxdb2
      - influxdb-causal-config:/etc/influxdb2
    networks:
      - causal-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # TimescaleDB for high-performance time-series analysis
  timescaledb-causal:
    image: timescale/timescaledb:latest-pg15
    container_name: prometheus-timescaledb-causal
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: prometheus_timeseries
      POSTGRES_USER: prometheus
      POSTGRES_PASSWORD: prometheus123
    volumes:
      - timescaledb-causal-data:/var/lib/postgresql/data
      - ./database/timescaledb/init-causal.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - causal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prometheus -d prometheus_timeseries"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Consul for service discovery
  consul:
    image: consul:1.16
    container_name: prometheus-consul
    restart: unless-stopped
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -data-dir=/consul/data
    volumes:
      - consul-data:/consul/data
      - consul-config:/consul/config
    networks:
      - causal-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus-monitoring
    restart: unless-stopped
    ports:
      - "9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus-causal.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - causal-network
    depends_on:
      - causal-analysis

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.1.0
    container_name: prometheus-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: prometheus123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - causal-network
    depends_on:
      - prometheus

  # Apache Kafka for real-time data streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: prometheus-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - causal-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: prometheus-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - causal-network
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy for production deployment
  nginx:
    image: nginx:1.25-alpine
    container_name: prometheus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-causal.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - nginx-logs:/var/log/nginx
    networks:
      - causal-network
    depends_on:
      - causal-analysis
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  causal-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  # Application volumes
  causal-logs:
    driver: local
  causal-cache:
    driver: local
  
  # Database volumes
  postgres-causal-data:
    driver: local
  redis-causal-data:
    driver: local
  neo4j-causal-data:
    driver: local
  neo4j-causal-logs:
    driver: local
  neo4j-causal-import:
    driver: local
  neo4j-causal-plugins:
    driver: local
  influxdb-causal-data:
    driver: local
  influxdb-causal-config:
    driver: local
  timescaledb-causal-data:
    driver: local
  
  # Service discovery and monitoring
  consul-data:
    driver: local
  consul-config:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  
  # Streaming and messaging
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  kafka-data:
    driver: local
  
  # Web server
  nginx-logs:
    driver: local