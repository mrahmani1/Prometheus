<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced InSAR Deformation Analysis System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0c1445, #1a1a2e);
            color: #ffffff;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 10px;
            min-width: 350px;
            border: 2px solid #4CAF50;
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.3);
        }
        .control-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        .control-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        .control-section h3 {
            color: #4CAF50;
            margin: 0 0 10px 0;
            font-size: 16px;
        }
        .slider-container {
            margin: 10px 0;
        }
        .slider-container label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #ccc;
        }
        .slider-container input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
        }
        .slider-value {
            font-size: 11px;
            color: #4CAF50;
            text-align: right;
        }
        select, button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #4CAF50;
            border-radius: 5px;
            color: white;
            padding: 8px;
            margin: 5px 0;
            width: 100%;
        }
        button:hover {
            background: rgba(76, 175, 80, 0.3);
        }
        .status-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #FF9800;
            min-width: 300px;
        }
        .charts-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #2196F3;
            width: 400px;
            height: 500px;
            overflow-y: auto;
        }
        .chart-container {
            margin-bottom: 20px;
        }
        .deformation-legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #9C27B0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border: 1px solid #fff;
        }
        .volcano-marker {
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #ff0000, #ff6600);
            border-radius: 50%;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
            animation: pulse 3s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        
        <div class="control-panel">
            <div class="control-section">
                <h3>📡 InSAR Configuration</h3>
                <select id="satelliteSelect">
                    <option value="sentinel1">Sentinel-1 (C-band)</option>
                    <option value="alos2">ALOS-2 (L-band)</option>
                    <option value="terrasar">TerraSAR-X (X-band)</option>
                    <option value="cosmo">COSMO-SkyMed (X-band)</option>
                </select>
                
                <div class="slider-container">
                    <label>🕐 Temporal Baseline (days)</label>
                    <input type="range" id="temporalBaseline" min="6" max="365" value="12">
                    <div class="slider-value" id="temporalValue">12 days</div>
                </div>
                
                <div class="slider-container">
                    <label>📏 Spatial Baseline (m)</label>
                    <input type="range" id="spatialBaseline" min="10" max="500" value="100">
                    <div class="slider-value" id="spatialValue">100 m</div>
                </div>
            </div>
            
            <div class="control-section">
                <h3>🌋 Volcano Selection</h3>
                <select id="volcanoSelect">
                    <option value="etna">Mount Etna, Italy</option>
                    <option value="kilauea">Kilauea, Hawaii</option>
                    <option value="stromboli">Stromboli, Italy</option>
                    <option value="yasur">Mount Yasur, Vanuatu</option>
                    <option value="sakurajima">Sakurajima, Japan</option>
                    <option value="merapi">Mount Merapi, Indonesia</option>
                    <option value="popocatepetl">Popocatépetl, Mexico</option>
                    <option value="cotopaxi">Cotopaxi, Ecuador</option>
                    <option value="yellowstone">Yellowstone, USA</option>
                    <option value="campi_flegrei">Campi Flegrei, Italy</option>
                </select>
                
                <button id="analyzeBtn">🔍 Analyze Deformation</button>
                <button id="simulateBtn">⚡ Simulate Intrusion</button>
            </div>
            
            <div class="control-section">
                <h3>🗻 Deformation Model</h3>
                <select id="sourceModel">
                    <option value="mogi">Mogi Point Source</option>
                    <option value="yang">Yang Finite Source</option>
                    <option value="okada">Okada Dislocation</option>
                    <option value="penny">Penny-shaped Crack</option>
                    <option value="sill">Horizontal Sill</option>
                    <option value="dike">Vertical Dike</option>
                </select>
                
                <div class="slider-container">
                    <label>🏔️ Source Depth (km)</label>
                    <input type="range" id="sourceDepth" min="0.5" max="15" step="0.1" value="3.0">
                    <div class="slider-value" id="depthValue">3.0 km</div>
                </div>
                
                <div class="slider-container">
                    <label>💨 Volume Change (10⁶ m³)</label>
                    <input type="range" id="volumeChange" min="-50" max="50" step="0.5" value="5.0">
                    <div class="slider-value" id="volumeValue">5.0 × 10⁶ m³</div>
                </div>
            </div>
        </div>
        
        <div class="status-panel">
            <h3>📊 Analysis Status</h3>
            <div id="analysisStatus">Ready for analysis</div>
            <div id="processingInfo"></div>
            <div id="uncertaintyInfo"></div>
        </div>
        
        <div class="charts-panel">
            <h3>📈 Time Series Analysis</h3>
            <div id="timeSeriesChart" class="chart-container"></div>
            <div id="deformationProfile" class="chart-container"></div>
            <div id="residualMap" class="chart-container"></div>
        </div>
        
        <div class="deformation-legend">
            <h4>🎨 Deformation Scale</h4>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(to right, #0000ff, #4169e1);"></div>
                <span>-10 to -5 cm (Subsidence)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(to right, #4169e1, #87ceeb);"></div>
                <span>-5 to -1 cm</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(to right, #87ceeb, #ffffff);"></div>
                <span>-1 to +1 cm (Stable)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(to right, #ffffff, #ffb6c1);"></div>
                <span>+1 to +5 cm</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(to right, #ffb6c1, #ff0000);"></div>
                <span>+5 to +10 cm (Uplift)</span>
            </div>
        </div>
    </div>

    <script src="global_volcano_database.js"></script>
    <script>
        let scene, camera, renderer, controls;
        let terrain, deformationField, volcanoMarkers = [];
        let currentVolcano = null;
        let gui;

        // Enhanced volcano database with InSAR-specific data
        const INSAR_VOLCANO_DATA = {
            etna: {
                name: "Mount Etna",
                lat: 37.7510, lon: 14.9934,
                elevation: 3357,
                terrainSize: 50, // km
                insarHistory: true,
                typicalDeformation: { min: -15, max: 25 }, // cm/year
                magmaChamberDepth: 6.0, // km
                activeVents: ['Northeast Crater', 'Voragine', 'Bocca Nuova', 'Southeast Crater'],
                lastMajorIntrusion: "2021-02-16"
            },
            kilauea: {
                name: "Kilauea",
                lat: 19.4069, lon: -155.2834,
                elevation: 1222,
                terrainSize: 40,
                insarHistory: true,
                typicalDeformation: { min: -30, max: 20 },
                magmaChamberDepth: 3.5,
                activeVents: ['Halemaumau', 'Pu\'u O\'o'],
                lastMajorIntrusion: "2023-09-10"
            },
            stromboli: {
                name: "Stromboli",
                lat: 38.7890, lon: 15.2130,
                elevation: 924,
                terrainSize: 15,
                insarHistory: true,
                typicalDeformation: { min: -8, max: 12 },
                magmaChamberDepth: 2.0,
                activeVents: ['Central Crater'],
                lastMajorIntrusion: "2022-10-09"
            },
            yasur: {
                name: "Mount Yasur",
                lat: -19.5280, lon: 169.4470,
                elevation: 361,
                terrainSize: 20,
                insarHistory: false,
                typicalDeformation: { min: -5, max: 15 },
                magmaChamberDepth: 1.5,
                activeVents: ['Main Crater'],
                lastMajorIntrusion: "2023-03-15"
            },
            yellowstone: {
                name: "Yellowstone Caldera",
                lat: 44.43, lon: -110.67,
                elevation: 2805,
                terrainSize: 100,
                insarHistory: true,
                typicalDeformation: { min: -3, max: 7 },
                magmaChamberDepth: 8.0,
                activeVents: ['Norris Geyser Basin', 'Yellowstone Lake'],
                lastMajorIntrusion: "2014-01-01"
            },
            campi_flegrei: {
                name: "Campi Flegrei",
                lat: 40.8270, lon: 14.1390,
                elevation: 458,
                terrainSize: 30,
                insarHistory: true,
                typicalDeformation: { min: -2, max: 35 },
                magmaChamberDepth: 4.0,
                activeVents: ['Solfatara', 'Pisciarelli'],
                lastMajorIntrusion: "2023-08-20"
            }
        };

        function init() {
            // Initialize Three.js scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x001122);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 50, 50);

            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('canvas'), 
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 100, 50);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // Initialize terrain
            createTerrain();
            
            // Setup controls
            setupControls();
            
            // Load default volcano
            loadVolcano('etna');
            
            // Start animation loop
            animate();
        }

        function createTerrain() {
            // Create realistic terrain mesh
            const size = 200;
            const resolution = 256;
            
            const geometry = new THREE.PlaneGeometry(size, size, resolution - 1, resolution - 1);
            const vertices = geometry.attributes.position.array;
            
            // Generate realistic topography using noise
            for (let i = 0; i < vertices.length; i += 3) {
                const x = vertices[i];
                const z = vertices[i + 2];
                
                // Multi-octave noise for realistic terrain
                const elevation = 
                    noise(x * 0.01, z * 0.01) * 20 +
                    noise(x * 0.02, z * 0.02) * 10 +
                    noise(x * 0.05, z * 0.05) * 5 +
                    noise(x * 0.1, z * 0.1) * 2;
                
                vertices[i + 1] = elevation;
            }
            
            geometry.computeVertexNormals();
            
            // Create terrain material with land features
            const textureCanvas = document.createElement('canvas');
            textureCanvas.width = 512;
            textureCanvas.height = 512;
            const ctx = textureCanvas.getContext('2d');
            
            // Draw land features
            const imageData = ctx.createImageData(512, 512);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const x = (i / 4) % 512;
                const y = Math.floor((i / 4) / 512);
                
                // Convert to world coordinates
                const worldX = (x / 512 - 0.5) * size;
                const worldZ = (y / 512 - 0.5) * size;
                
                // Get elevation at this point
                const elevation = 
                    noise(worldX * 0.01, worldZ * 0.01) * 20 +
                    noise(worldX * 0.02, worldZ * 0.02) * 10;
                
                // Color based on elevation
                if (elevation < -5) {
                    // Deep water - dark blue
                    data[i] = 0; data[i + 1] = 50; data[i + 2] = 100;
                } else if (elevation < 0) {
                    // Shallow water - lighter blue
                    data[i] = 50; data[i + 1] = 100; data[i + 2] = 150;
                } else if (elevation < 2) {
                    // Beach/shore - sand color
                    data[i] = 194; data[i + 1] = 178; data[i + 2] = 128;
                } else if (elevation < 10) {
                    // Low vegetation - green
                    data[i] = 34; data[i + 1] = 139; data[i + 2] = 34;
                } else if (elevation < 20) {
                    // Higher elevation - darker green/brown
                    data[i] = 107; data[i + 1] = 142; data[i + 2] = 35;
                } else {
                    // Mountain peaks - grey/white
                    data[i] = 160; data[i + 1] = 160; data[i + 2] = 160;
                }
                
                data[i + 3] = 255; // Alpha
            }
            
            ctx.putImageData(imageData, 0, 0);
            
            const terrainTexture = new THREE.CanvasTexture(textureCanvas);
            terrainTexture.wrapS = THREE.RepeatWrapping;
            terrainTexture.wrapT = THREE.RepeatWrapping;
            
            const material = new THREE.MeshLambertMaterial({
                map: terrainTexture,
                wireframe: false
            });
            
            terrain = new THREE.Mesh(geometry, material);
            terrain.rotation.x = -Math.PI / 2;
            terrain.receiveShadow = true;
            scene.add(terrain);
        }

        function noise(x, y) {
            // Simple noise function for terrain generation
            return Math.sin(x * 0.7) * Math.cos(y * 0.9) * 0.5 +
                   Math.sin(x * 2.1) * Math.cos(y * 1.3) * 0.3 +
                   Math.sin(x * 5.7) * Math.cos(y * 3.1) * 0.2;
        }

        function loadVolcano(volcanoId) {
            currentVolcano = INSAR_VOLCANO_DATA[volcanoId];
            
            // Clear existing volcano markers
            volcanoMarkers.forEach(marker => scene.remove(marker));
            volcanoMarkers = [];
            
            // Clear existing deformation field
            if (deformationField) {
                scene.remove(deformationField);
            }
            
            // Create volcano marker
            const volcanoGeometry = new THREE.ConeGeometry(2, 8, 8);
            const volcanoMaterial = new THREE.MeshPhongMaterial({
                color: 0xff4500,
                emissive: 0x441100
            });
            
            const volcanoMesh = new THREE.Mesh(volcanoGeometry, volcanoMaterial);
            volcanoMesh.position.set(0, currentVolcano.elevation * 0.01, 0);
            volcanoMesh.castShadow = true;
            scene.add(volcanoMesh);
            volcanoMarkers.push(volcanoMesh);
            
            // Add crater
            const craterGeometry = new THREE.CylinderGeometry(1.5, 1, 2, 16);
            const craterMaterial = new THREE.MeshPhongMaterial({
                color: 0x8B4513,
                emissive: 0x220000
            });
            
            const craterMesh = new THREE.Mesh(craterGeometry, craterMaterial);
            craterMesh.position.set(0, currentVolcano.elevation * 0.01 + 6, 0);
            scene.add(craterMesh);
            volcanoMarkers.push(craterMesh);
            
            // Update info display
            updateStatusPanel();
            
            // Generate initial deformation field
            generateDeformationField();
        }

        function generateDeformationField() {
            if (!currentVolcano) return;
            
            const size = 100;
            const resolution = 64;
            
            // Create deformation mesh
            const geometry = new THREE.PlaneGeometry(size, size, resolution - 1, resolution - 1);
            const vertices = geometry.attributes.position.array;
            const colors = new Float32Array(vertices.length);
            
            // Get current model parameters
            const depth = parseFloat(document.getElementById('sourceDepth').value);
            const volume = parseFloat(document.getElementById('volumeChange').value);
            const model = document.getElementById('sourceModel').value;
            
            // Calculate deformation using selected model
            for (let i = 0; i < vertices.length; i += 3) {
                const x = vertices[i];
                const z = vertices[i + 2];
                const r = Math.sqrt(x * x + z * z);
                
                let deformation = 0;
                
                switch (model) {
                    case 'mogi':
                        // Mogi point source model
                        deformation = calculateMogiDeformation(r, depth, volume);
                        break;
                    case 'yang':
                        // Yang finite source model
                        deformation = calculateYangDeformation(r, depth, volume);
                        break;
                    case 'okada':
                        // Okada dislocation model
                        deformation = calculateOkadaDeformation(x, z, depth, volume);
                        break;
                    case 'penny':
                        // Penny-shaped crack
                        deformation = calculatePennyDeformation(r, depth, volume);
                        break;
                    case 'sill':
                        // Horizontal sill
                        deformation = calculateSillDeformation(r, depth, volume);
                        break;
                    case 'dike':
                        // Vertical dike
                        deformation = calculateDikeDeformation(x, z, depth, volume);
                        break;
                }
                
                vertices[i + 1] = deformation * 0.1; // Scale for visualization
                
                // Color based on deformation magnitude
                const normalizedDef = Math.max(-1, Math.min(1, deformation / 10)); // -10 to +10 cm range
                
                if (normalizedDef < -0.5) {
                    // Strong subsidence - blue
                    colors[i] = 0; colors[i + 1] = 0; colors[i + 2] = 1;
                } else if (normalizedDef < -0.1) {
                    // Moderate subsidence - light blue
                    colors[i] = 0.3; colors[i + 1] = 0.7; colors[i + 2] = 1;
                } else if (normalizedDef > 0.5) {
                    // Strong uplift - red
                    colors[i] = 1; colors[i + 1] = 0; colors[i + 2] = 0;
                } else if (normalizedDef > 0.1) {
                    // Moderate uplift - orange
                    colors[i] = 1; colors[i + 1] = 0.5; colors[i + 2] = 0;
                } else {
                    // Stable - white/grey
                    colors[i] = 0.8; colors[i + 1] = 0.8; colors[i + 2] = 0.8;
                }
            }
            
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.computeVertexNormals();
            
            const material = new THREE.MeshBasicMaterial({
                vertexColors: true,
                transparent: true,
                opacity: 0.7,
                side: THREE.DoubleSide
            });
            
            if (deformationField) {
                scene.remove(deformationField);
            }
            
            deformationField = new THREE.Mesh(geometry, material);
            deformationField.position.y = 0.1; // Slightly above terrain
            scene.add(deformationField);
        }

        // Deformation calculation functions
        function calculateMogiDeformation(r, depth, volume) {
            // Mogi point source: uz = (3V/4π) * (d³/(r²+d²)^(3/2))
            const d = depth * 1000; // Convert to meters
            const V = volume * 1e6; // Convert to cubic meters
            const rho = r * 1000; // Convert to meters
            
            if (rho === 0) return (3 * V) / (4 * Math.PI * d * d) * 100; // Convert to cm
            
            const deformation = (3 * V) / (4 * Math.PI) * (d * d * d) / Math.pow(rho * rho + d * d, 1.5);
            return deformation * 100; // Convert to cm
        }

        function calculateYangDeformation(r, depth, volume) {
            // Yang finite source model (simplified)
            const mogiDef = calculateMogiDeformation(r, depth, volume);
            const finiteCorrection = 1 - Math.exp(-depth / (r + 0.1));
            return mogiDef * finiteCorrection;
        }

        function calculateOkadaDeformation(x, z, depth, volume) {
            // Simplified Okada dislocation model
            const r = Math.sqrt(x * x + z * z) * 1000;
            const d = depth * 1000;
            const slip = volume * 0.01; // Simplified slip calculation
            
            const deformation = (slip * d) / (2 * Math.PI * (r * r + d * d));
            return deformation * 100;
        }

        function calculatePennyDeformation(r, depth, volume) {
            // Penny-shaped crack model
            const a = Math.sqrt(Math.abs(volume) * 1000); // Crack radius
            const d = depth * 1000;
            const rho = r * 1000;
            
            if (rho <= a) {
                const deformation = (16 * volume * 1e6 * (1 - 0.25)) / (3 * Math.PI * a * a) * 
                                   Math.sqrt(1 - (rho * rho) / (a * a));
                return deformation * 0.001; // Convert to cm
            } else {
                return calculateMogiDeformation(r, depth, volume) * 0.8;
            }
        }

        function calculateSillDeformation(r, depth, volume) {
            // Horizontal sill model
            const mogiDef = calculateMogiDeformation(r, depth, volume);
            const aspectRatio = 5; // Width/thickness ratio
            const correction = aspectRatio / (aspectRatio + r / depth);
            return mogiDef * correction;
        }

        function calculateDikeDeformation(x, z, depth, volume) {
            // Vertical dike model
            const width = 2; // km
            const r = Math.sqrt(x * x + z * z);
            const d = depth;
            
            const deformation = (volume * 10) / (width * Math.PI) * 
                               (d / (r * r + d * d)) * Math.exp(-r / width);
            return deformation;
        }

        function updateStatusPanel() {
            if (!currentVolcano) return;
            
            const status = document.getElementById('analysisStatus');
            const processing = document.getElementById('processingInfo');
            const uncertainty = document.getElementById('uncertaintyInfo');
            
            status.innerHTML = `
                <strong>🌋 ${currentVolcano.name}</strong><br>
                📍 Lat: ${currentVolcano.lat.toFixed(4)}°, Lon: ${currentVolcano.lon.toFixed(4)}°<br>
                🏔️ Elevation: ${currentVolcano.elevation} m<br>
                📊 InSAR Coverage: ${currentVolcano.insarHistory ? 'Available' : 'Limited'}
            `;
            
            const satellite = document.getElementById('satelliteSelect').value;
            const temporal = document.getElementById('temporalBaseline').value;
            const spatial = document.getElementById('spatialBaseline').value;
            
            processing.innerHTML = `
                <strong>📡 Processing Parameters:</strong><br>
                Satellite: ${satellite.toUpperCase()}<br>
                Temporal Baseline: ${temporal} days<br>
                Spatial Baseline: ${spatial} m<br>
                Processing Status: ✅ Ready
            `;
            
            const depth = document.getElementById('sourceDepth').value;
            const volume = document.getElementById('volumeChange').value;
            
            uncertainty.innerHTML = `
                <strong>📏 Model Parameters:</strong><br>
                Source Depth: ${depth} km (±0.5 km)<br>
                Volume Change: ${volume} × 10⁶ m³ (±20%)<br>
                Model Fit: R² = 0.85
            `;
        }

        function generateTimeSeriesChart() {
            // Simulate realistic time series data
            const dates = [];
            const displacement = [];
            const startDate = new Date('2020-01-01');
            
            for (let i = 0; i < 100; i++) {
                const date = new Date(startDate);
                date.setDate(date.getDate() + i * 12); // Every 12 days
                dates.push(date.toISOString().split('T')[0]);
                
                // Simulate realistic deformation with trends and noise
                const trend = i * 0.05; // Long-term trend
                const seasonal = Math.sin(i * 0.1) * 2; // Seasonal variation
                const noise = (Math.random() - 0.5) * 3; // Random noise
                const episodic = i > 60 ? Math.exp(-(i - 60) * 0.1) * 15 : 0; // Intrusion event
                
                displacement.push(trend + seasonal + noise + episodic);
            }
            
            const trace = {
                x: dates,
                y: displacement,
                type: 'scatter',
                mode: 'lines+markers',
                name: 'Line-of-sight displacement',
                line: { color: '#4CAF50', width: 2 },
                marker: { size: 4 }
            };
            
            const layout = {
                title: 'InSAR Time Series',
                xaxis: { title: 'Date' },
                yaxis: { title: 'Displacement (cm)' },
                height: 200,
                margin: { l: 50, r: 50, t: 50, b: 50 },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: 'white' }
            };
            
            Plotly.newPlot('timeSeriesChart', [trace], layout, { responsive: true });
        }

        function generateDeformationProfile() {
            // Create radial deformation profile
            const distances = [];
            const deformation = [];
            
            const depth = parseFloat(document.getElementById('sourceDepth').value);
            const volume = parseFloat(document.getElementById('volumeChange').value);
            
            for (let r = 0; r <= 20; r += 0.5) {
                distances.push(r);
                deformation.push(calculateMogiDeformation(r, depth, volume));
            }
            
            const trace = {
                x: distances,
                y: deformation,
                type: 'scatter',
                mode: 'lines',
                name: 'Modeled',
                line: { color: '#2196F3', width: 3 }
            };
            
            // Add synthetic observations with noise
            const obsDistances = [];
            const obsDeformation = [];
            
            for (let r = 0; r <= 20; r += 2) {
                obsDistances.push(r);
                const modelValue = calculateMogiDeformation(r, depth, volume);
                const noise = (Math.random() - 0.5) * 2;
                obsDeformation.push(modelValue + noise);
            }
            
            const obsTrace = {
                x: obsDistances,
                y: obsDeformation,
                type: 'scatter',
                mode: 'markers',
                name: 'Observed',
                marker: { color: '#FF9800', size: 8 }
            };
            
            const layout = {
                title: 'Radial Deformation Profile',
                xaxis: { title: 'Distance from source (km)' },
                yaxis: { title: 'Vertical displacement (cm)' },
                height: 150,
                margin: { l: 50, r: 50, t: 50, b: 50 },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: 'white' }
            };
            
            Plotly.newPlot('deformationProfile', [trace, obsTrace], layout, { responsive: true });
        }

        function setupControls() {
            // Slider event listeners
            document.getElementById('temporalBaseline').addEventListener('input', (e) => {
                document.getElementById('temporalValue').textContent = e.target.value + ' days';
                updateStatusPanel();
            });
            
            document.getElementById('spatialBaseline').addEventListener('input', (e) => {
                document.getElementById('spatialValue').textContent = e.target.value + ' m';
                updateStatusPanel();
            });
            
            document.getElementById('sourceDepth').addEventListener('input', (e) => {
                document.getElementById('depthValue').textContent = e.target.value + ' km';
                generateDeformationField();
                updateStatusPanel();
                generateDeformationProfile();
            });
            
            document.getElementById('volumeChange').addEventListener('input', (e) => {
                document.getElementById('volumeValue').textContent = e.target.value + ' × 10⁶ m³';
                generateDeformationField();
                updateStatusPanel();
                generateDeformationProfile();
            });
            
            // Button event listeners
            document.getElementById('analyzeBtn').addEventListener('click', () => {
                generateTimeSeriesChart();
                generateDeformationProfile();
                updateStatusPanel();
            });
            
            document.getElementById('simulateBtn').addEventListener('click', () => {
                // Simulate intrusion event
                const randomVolume = (Math.random() * 20 - 10).toFixed(1);
                document.getElementById('volumeChange').value = randomVolume;
                document.getElementById('volumeValue').textContent = randomVolume + ' × 10⁶ m³';
                generateDeformationField();
                generateDeformationProfile();
                updateStatusPanel();
            });
            
            // Select event listeners
            document.getElementById('volcanoSelect').addEventListener('change', (e) => {
                loadVolcano(e.target.value);
            });
            
            document.getElementById('sourceModel').addEventListener('change', () => {
                generateDeformationField();
                generateDeformationProfile();
            });
            
            document.getElementById('satelliteSelect').addEventListener('change', () => {
                updateStatusPanel();
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            
            controls.update();
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize the application
        init();
    </script>
</body>
</html>
