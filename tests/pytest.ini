[tool:pytest]
# Pytest configuration for Prometheus AI platform testing

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for end-to-end workflows
    performance: Performance and scalability tests
    benchmark: Benchmark validation tests against geological datasets
    slow: Tests that take more than 30 seconds to run
    gpu: Tests that require GPU acceleration
    database: Tests that require database connections
    network: Tests that require network connectivity
    
# Test output
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --color=yes
    --durations=10
    --cov=services
    --cov-report=html:tests/coverage_html
    --cov-report=term-missing
    --cov-fail-under=80
    
# Minimum version
minversion = 7.0

# Test timeout (in seconds)
timeout = 300

# Parallel execution
# addopts = -n auto  # Uncomment to enable parallel execution

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:torch.*
    
# Environment variables for testing
env =
    TESTING = true
    LOG_LEVEL = DEBUG
    DATABASE_URL = sqlite:///:memory:
    REDIS_URL = redis://localhost:6379/1